<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
<title>task backlog</title>
<link rel="icon" id="favicon" href="data:,">
<style>
:root{
  --bg:#F6F7F8; --panel:#FFFFFF; --sunk:#EFF1F3; --hover:#F3F5F7; --field:#FFFFFF;
  --ink:#1A1D21; --ink2:#5A6270; --ink3:#8B94A3;
  --line:#E1E5EA; --line2:#EDF0F3;
  --accent:#2A6F97; --accent-bg:#E7F0F6; --on-accent:#fff;
  --red:#B4402F; --red-bg:#FAEAE7;
  --amber:#8A5B12; --amber-bg:#FAF0DD;
  --green:#2F6B4F; --green-bg:#E6F1EA;
  --violet:#5B4A8A; --violet-bg:#EEEBF7;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 6px 20px rgba(16,24,40,.07);
  --radius:8px;
  /* ハタラクティブのロゴガイドライン v3.0 の推奨に合わせる: 欧文・数字 Montserrat、和文 Noto Sans JP。
     どちらも Google Fonts。ネットワークが無い環境では落ちてこないので、
     その下の並び（Segoe UI / Yu Gothic UI）だけで成立するようにしてある。 */
  --f:"Montserrat","Noto Sans JP","Segoe UI","Yu Gothic UI","Hiragino Sans",system-ui,sans-serif;
  /* Slack リストの色名に合わせた見出し用の色。Slack 側は色名しか持っていないので、
     色味はここで決めている。前が文字色、後ろが背景。 */
  --sc-gray:#5F5E5A;   --sc-gray-bg:#EFEEE9;
  --sc-brown:#7A5230;  --sc-brown-bg:#F4EDE4;
  --sc-orange:#9A5A15; --sc-orange-bg:#FAEFE0;
  --sc-yellow:#836613; --sc-yellow-bg:#F9F2D9;
  --sc-green:#2F6B4F;  --sc-green-bg:#E5F1E9;
  --sc-cyan:#16697A;   --sc-cyan-bg:#E1F0F3;
  --sc-blue:#1F5FA8;   --sc-blue-bg:#E7F0FA;
  --sc-indigo:#4A47A8; --sc-indigo-bg:#EAE9F9;
  --sc-purple:#6B46A8; --sc-purple-bg:#F0E9FA;
  --sc-pink:#A8386B;   --sc-pink-bg:#FAE8EF;
  --sc-red:#A83228;    --sc-red-bg:#FAE9E6;
  --fm:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#262624; --panel:#2B2A28; --sunk:#30302E; --hover:#353431; --field:#30302E;
    --ink:#F2F1EC; --ink2:#C2C0B6; --ink3:#8E8C84;
    --line:#3D3C38; --line2:#33322F;
    --accent:#6FB0D6; --accent-bg:#1B2E3A; --on-accent:#1F1E1D;
    --red:#E08C7C; --red-bg:#33211E;
    --amber:#D8A855; --amber-bg:#2E2617;
    --green:#7BB595; --green-bg:#1A2A22;
    --violet:#A99BD6; --violet-bg:#25213A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
  --sc-gray:#A6A69E;   --sc-gray-bg:#33322F;
  --sc-brown:#C9A47D;  --sc-brown-bg:#2E2419;
  --sc-orange:#D79B55; --sc-orange-bg:#30251A;
  --sc-yellow:#CFB65C; --sc-yellow-bg:#2C2818;
  --sc-green:#7FB89A;  --sc-green-bg:#1A2A22;
  --sc-cyan:#6FBECE;   --sc-cyan-bg:#16292F;
  --sc-blue:#7FB0E0;   --sc-blue-bg:#182635;
  --sc-indigo:#A9A5EE; --sc-indigo-bg:#22213A;
  --sc-purple:#BFA0E8; --sc-purple-bg:#281F38;
  --sc-pink:#E59BBE;   --sc-pink-bg:#341F2A;
  --sc-red:#E08C7C;    --sc-red-bg:#33211E;
  }
}
:root[data-theme="dark"]{
  --bg:#262624; --panel:#2B2A28; --sunk:#30302E; --hover:#353431; --field:#30302E;
  --ink:#F2F1EC; --ink2:#C2C0B6; --ink3:#8E8C84;
  --line:#3D3C38; --line2:#33322F;
  --accent:#6FB0D6; --accent-bg:#1B2E3A; --on-accent:#1F1E1D;
  --red:#E08C7C; --red-bg:#33211E;
  --amber:#D8A855; --amber-bg:#2E2617;
  --green:#7BB595; --green-bg:#1A2A22;
  --violet:#A99BD6; --violet-bg:#25213A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
  --sc-gray:#A6A69E;   --sc-gray-bg:#33322F;
  --sc-brown:#C9A47D;  --sc-brown-bg:#2E2419;
  --sc-orange:#D79B55; --sc-orange-bg:#30251A;
  --sc-yellow:#CFB65C; --sc-yellow-bg:#2C2818;
  --sc-green:#7FB89A;  --sc-green-bg:#1A2A22;
  --sc-cyan:#6FBECE;   --sc-cyan-bg:#16292F;
  --sc-blue:#7FB0E0;   --sc-blue-bg:#182635;
  --sc-indigo:#A9A5EE; --sc-indigo-bg:#22213A;
  --sc-purple:#BFA0E8; --sc-purple-bg:#281F38;
  --sc-pink:#E59BBE;   --sc-pink-bg:#341F2A;
  --sc-red:#E08C7C;    --sc-red-bg:#33211E;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f); font-size:13.5px; line-height:1.6;
  letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
::selection{background:var(--accent-bg)}

.app{display:grid;grid-template-columns:236px 1fr;height:100vh}

/* ---------- sidebar ---------- */
.side{
  background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}
.side-head{padding:14px 14px 10px;border-bottom:1px solid var(--line2)}
.brand{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.brand b{color:var(--ink);font-weight:700}
.storage{
  margin-top:9px; display:flex; align-items:center; gap:6px;
  font-size:11.5px; color:var(--ink2);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink3);flex:none}
.dot.ok{background:var(--green)}
.dot.warn{background:var(--amber)}
.storage button{
  font-size:11.5px;color:var(--accent);text-decoration:underline;
  text-underline-offset:2px;
}
.side-scroll{flex:1;overflow-y:auto;padding:10px 8px}
.side-label{
  font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;
  padding:8px 6px 5px;display:flex;justify-content:space-between;align-items:center;
}
.side-label button{color:var(--ink3);font-size:15px;line-height:1;padding:2px 5px;border-radius:5px}
.side-label button:hover{background:var(--hover);color:var(--ink)}
.prow{display:flex;align-items:center;border-radius:6px}
.prow:hover{background:var(--hover)}
.prow.on{background:var(--accent-bg)}
.pitem{
  display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-align:left;
  padding:6px 8px;border-radius:6px;color:var(--ink2);
}
.prow.on .pitem{color:var(--ink);font-weight:600}
.pmenu{
  flex:none;color:var(--ink3);padding:2px 7px;border-radius:5px;
  opacity:0;font-size:14px;line-height:1;
}
.prow:hover .pmenu{opacity:1}
.pmenu:hover{background:var(--sunk);color:var(--ink)}
.pitem .swatch{width:8px;height:8px;border-radius:2px;flex:none;background:var(--accent)}
.pitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .ct{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.side-foot{
  border-top:1px solid var(--line2); padding:9px 12px;
  display:flex; gap:12px; flex-wrap:wrap;
}
.side-foot button{font-size:11.5px;color:var(--ink2)}
.side-foot button:hover{color:var(--accent)}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
/* Asana と同じ並び: 検索（中央）→ プロジェクト名 → ビューのタブ */
.top{
  background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 20px 0;
}
.top-search{position:relative;display:flex;justify-content:center;padding-bottom:12px;margin:0 -20px 12px;
  border-bottom:1px solid var(--line2)}
.top-row{display:flex;align-items:center;gap:12px}
.title{
  font-size:24px;font-weight:700;letter-spacing:-.01em;
  background:none;border:0;padding:2px 4px;margin-left:-4px;border-radius:5px;
  min-width:60px;max-width:640px;
}
.title:hover{background:var(--hover)}
.title:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--panel)}
.spacer{flex:1}
.search{
  background:var(--sunk);border:1px solid var(--line);border-radius:999px;
  padding:7px 16px;width:min(540px, 90%);font-size:13px;color:var(--ink);
}
.search:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.iconbtn{
  padding:5px 9px;border-radius:6px;color:var(--ink2);border:1px solid var(--line);
}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.chips{display:flex;gap:6px;padding:11px 0 10px;flex-wrap:wrap;align-items:center}
.chip{
  padding:3px 10px;border-radius:20px;font-size:12px;color:var(--ink2);
  border:1px solid var(--line);
}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}
.chip.alert:not(.on){color:var(--red);border-color:var(--red)}
.sep{width:1px;height:16px;background:var(--line);margin:0 3px}
.toggle{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:5px;cursor:pointer}

.fnote{
  margin:0 0 10px;padding:6px 11px;border-radius:6px;font-size:12px;
  background:var(--amber-bg);color:var(--amber);
  display:flex;align-items:center;gap:10px;
}
.fnote button{
  color:inherit;text-decoration:underline;text-underline-offset:2px;font-weight:600;
}
.list{flex:1;overflow-y:auto;padding:14px 20px 160px}
/* Backlog は列（セクション）ごとに縦スクロール。画面全体は横にだけ流れる */
.list.board-mode{overflow-x:auto;overflow-y:hidden;padding:14px 20px 16px;display:block}
.list.board-mode .board{height:100%;align-items:stretch}
.list.board-mode .col{max-height:100%;min-height:0;align-self:flex-start}
.list.board-mode .cards{overflow-y:auto;min-height:24px;flex:1 1 auto}
.list.board-mode .card{flex:none}
.list.board-mode .newcol{align-self:flex-start}

/* スクロールバーは細く、丸く（Chrome / Edge）。標準の scrollbar-width を書くと
   Chrome はこちらを無視して角ばった細バーになるので、あえて書かない */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink3);background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}

/* ---------- ビュー切替 ---------- */
/* 「カレンダーに追加」。ハタラグリーン（ハタラクティブ ロゴガイドライン v3.0 のメインカラー）に白文字 */
.cal-btn{
  flex:none;background:var(--main);color:#fff;font-weight:700;font-size:13px;
  padding:7px 16px;border-radius:7px;letter-spacing:.02em;
}
.cal-btn:hover{filter:brightness(.9)}
/* 週カレンダー表示中は「Backlog に戻る」ボタン。ハタラオレンジ（同ガイドラインのアクセントカラー） */
.cal-btn.back{background:var(--sub)}
/* ビューの切り替えはタブ。選んでいるものに下線 */
.vswitch{display:flex;gap:4px;margin:8px -20px 0;padding:0 16px;border-bottom:1px solid var(--line2)}
.vswitch button{padding:6px 10px 8px;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent;
  border-radius:6px 6px 0 0;margin-bottom:-1px}
.vswitch button:hover{background:var(--hover);color:var(--ink)}
.vswitch button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}

/* ---------- ボード ---------- */
/* 列ごとにスクロールさせない。ボードごと縦に伸ばして、
   スクロールは外側（.list）の1本だけにする。 */
.board{
  display:flex;gap:12px;align-items:flex-start;
  width:max-content;min-width:100%;
}
.col{
  flex:0 0 300px;max-width:300px;background:var(--sunk);border-radius:10px;
  display:flex;flex-direction:column;
}
.col.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.col-head{
  display:flex;align-items:center;gap:7px;padding:10px 12px 8px;flex:none;
  position:sticky;top:0;z-index:2;background:var(--sunk);border-radius:10px 10px 0 0;
}
.col-name{
  font-weight:700;font-size:13px;background:none;border:0;padding:2px 4px;
  border-radius:5px;flex:1;min-width:0;
}
.col-name:hover{background:var(--hover)}
.col-name:focus{outline:2px solid var(--accent);background:var(--panel)}
.col-ct{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.col-dot{width:8px;height:8px;border-radius:2px;flex:none}
.col-menu{color:var(--ink3);padding:2px 6px;border-radius:5px;opacity:0;font-size:14px;line-height:1}
.col-head:hover .col-menu{opacity:1}
.col-menu:hover{background:var(--hover);color:var(--ink)}
.cards{
  padding:0 8px 8px;
  display:flex;flex-direction:column;gap:9px;min-height:24px;
}
.col-add{padding:0 8px 10px;flex:none;display:flex;flex-direction:column;gap:5px}
.addproj{
  background:none;border:1px solid transparent;border-radius:6px;
  padding:3px 5px;font-size:11.5px;color:var(--ink3);max-width:100%;
}
.addproj:hover{border-color:var(--line);color:var(--ink2)}
.addproj:focus{outline:none;border-color:var(--accent);color:var(--ink)}
.add .addproj{flex:none;width:auto;max-width:130px}
.col-add input{
  width:100%;background:none;border:1px dashed var(--line);border-radius:7px;
  padding:7px 9px;font-size:12.5px;color:var(--ink);
}
.col-add input::placeholder{color:var(--ink3)}
.col-add input:focus{outline:none;border-style:solid;border-color:var(--accent);background:var(--panel)}
.newcol{flex:0 0 180px}
.newcol button{
  width:100%;text-align:left;padding:10px 12px;border-radius:10px;
  border:1px dashed var(--line);color:var(--ink3);font-size:12.5px;
}
.newcol button:hover{background:var(--hover);color:var(--accent);border-color:var(--accent)}

.card{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:20px 14px;min-height:104px;cursor:grab;position:relative;
  display:flex;flex-direction:column;justify-content:center;
}
.card:hover{border-color:var(--ink3)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.dragging{opacity:.4}
.card.drop-before::before,.card.drop-after::after{
  content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent);
}
.card.drop-before::before{top:-5px}
.card.drop-after::after{bottom:-5px}
.card-top{display:flex;align-items:flex-start;gap:8px}
.card-title{
  flex:1;min-width:0;font-size:13px;line-height:1.6;
  background:none;border:0;padding:1px 3px;margin:-1px -3px;border-radius:4px;
  font-family:inherit;color:inherit;
}
.card-title:focus{outline:none;background:var(--sunk)}
.card.done .card-title{color:var(--ink3);text-decoration:line-through}
.card .cb{margin-top:2px}
.card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;padding-left:24px}
.b-note{color:var(--ink3);font-size:12px}
.b-est{background:var(--sunk);color:var(--ink2);font-variant-numeric:tabular-nums}
.b-est.partial{color:var(--ink3)}
.est-ro{
  display:flex;align-items:baseline;gap:9px;padding:5px 0;
  font-variant-numeric:tabular-nums;
}
.est-note{font-size:11.5px;color:var(--ink3)}
@media (min-width:940px){
  body.drawer-open .main{margin-right:624px}
}

/* ---------- sections ---------- */
.sec{margin-bottom:18px}
.sec-head{
  display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;
  position:sticky;top:0;background:var(--bg);z-index:2;
}
.sec-head.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.caret{
  color:var(--ink3);font-size:10px;width:16px;height:16px;flex:none;
  display:grid;place-items:center;border-radius:4px;transition:transform .12s;
}
.caret:hover{background:var(--hover);color:var(--ink)}
.sec.collapsed .caret{transform:rotate(-90deg)}
.sec-name{
  font-weight:700;font-size:13.5px;background:none;border:0;padding:2px 4px;
  border-radius:5px;min-width:40px;
}
.sec-name:hover{background:var(--hover)}
.sec-name:focus{outline:2px solid var(--accent);background:var(--panel)}
.sec-ct{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.sec-menu{
  margin-left:auto;color:var(--ink3);padding:2px 7px;border-radius:5px;
  opacity:0;font-size:14px;line-height:1;
}
.sec-head:hover .sec-menu{opacity:1}
.sec-menu:hover{background:var(--hover);color:var(--ink)}
.sec-body{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  margin-top:5px;overflow:hidden;
}
.sec.collapsed .sec-body{display:none}

/* ---------- rows ---------- */
.row{
  display:flex;align-items:center;gap:9px;padding:0 12px 0 6px;
  min-height:37px;border-bottom:1px solid var(--line2);position:relative;
}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row.sel{background:var(--accent-bg)}
.row.dragging{opacity:.4}
.row.drop-before::before,.row.drop-after::after{
  content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent);
}
.row.drop-before::before{top:-1px}
.row.drop-after::after{bottom:-1px}
.grip{
  width:16px;flex:none;color:var(--ink3);opacity:0;cursor:grab;
  text-align:center;font-size:12px;line-height:1;user-select:none;
}
.row:hover .grip{opacity:.8}
.cb{
  width:16px;height:16px;flex:none;border:1.5px solid var(--ink3);border-radius:50%;
  display:grid;place-items:center;color:transparent;font-size:10px;
}
.cb:hover{border-color:var(--green);color:var(--green)}
.row.done .cb{background:var(--green);border-color:var(--green);color:#fff}
.t-title{
  flex:1;min-width:0;background:none;border:0;padding:6px 2px;border-radius:4px;
}
.t-title:focus{outline:none;background:var(--sunk)}
.row.done .t-title{color:var(--ink3);text-decoration:line-through}
.meta{display:flex;align-items:center;gap:8px;flex:none}
/* 一覧の行の工数・期日の欄。普段はバッジのように見せ、触ると入力欄になる */
.row-est{display:inline-flex;align-items:center;gap:2px;background:var(--sunk);border:1px solid transparent;
  border-radius:6px;padding:0 8px 0 2px;font-size:12.5px;color:var(--ink2);cursor:text}
.row-est:hover,.row-due:hover{border-color:var(--line)}
.row-est:focus-within{border-color:var(--accent);background:var(--field)}
.row-est input{width:48px;background:none;border:0;padding:4px 0 4px 4px;text-align:right;font-size:12.5px;
  color:var(--ink);font-variant-numeric:tabular-nums;font-family:inherit;-moz-appearance:textfield}
.row-est input::-webkit-inner-spin-button{opacity:0;width:0}
.row-est input:focus{outline:none}
.row-due{background:var(--sunk);border:1px solid transparent;border-radius:6px;padding:4px 8px;font-size:12.5px;
  color:var(--ink2);font-family:inherit;font-variant-numeric:tabular-nums;width:132px;cursor:pointer}
.row-due.nodue{color:var(--ink3)}
.row-due:focus{outline:none;border-color:var(--accent);background:var(--field)}
.row-due::-webkit-calendar-picker-indicator{opacity:.6;cursor:pointer}
.row-due.over{background:var(--red-bg);color:var(--red);font-weight:600}
.row-due.today{background:var(--amber-bg);color:var(--amber);font-weight:600}
.row-due.soon{background:var(--accent-bg);color:var(--accent)}
.badge{
  font-size:12.5px;padding:3px 9px;border-radius:5px;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.b-sub{color:var(--ink3)}
.b-link{color:var(--ink3);text-decoration:none;font-size:12px}
.b-link:hover{color:var(--accent)}
.b-pri-high{background:var(--red-bg);color:var(--red)}
.b-pri-mid{background:var(--amber-bg);color:var(--amber)}
.b-pri-low{background:var(--sunk);color:var(--ink2)}
.b-st{background:var(--sunk);color:var(--ink2)}
.b-st-doing{background:var(--accent-bg);color:var(--accent)}
.b-st-ticketed{background:var(--violet-bg);color:var(--violet)}
.b-st-release{background:var(--green-bg);color:var(--green)}
.b-sub.late{background:var(--red-bg);color:var(--red)}
.b-due{color:var(--ink2);background:var(--sunk)}
.b-due.over{background:var(--red-bg);color:var(--red);font-weight:600}
.b-due.today{background:var(--amber-bg);color:var(--amber);font-weight:600}
.b-due.soon{background:var(--accent-bg);color:var(--accent)}
.open{
  color:var(--ink3);font-size:11.5px;padding:2px 7px;border-radius:5px;
  border:1px solid var(--line);opacity:0;
}
.row:hover .open{opacity:1}
.open:hover{background:var(--sunk);color:var(--ink)}
.proj-tag{font-size:11.5px;font-weight:600;flex:none;padding:2px 9px;border-radius:999px;line-height:1.5;white-space:nowrap}

.add{display:flex;align-items:center;gap:9px;padding:0 12px 0 28px;min-height:36px}
.add input{
  flex:1;background:none;border:0;padding:7px 2px;color:var(--ink);
}
.add input::placeholder{color:var(--ink3)}
.add input:focus{outline:none}
.add .plus{color:var(--ink3);font-size:13px;flex:none}
.sec-add{
  margin-top:8px;font-size:12px;color:var(--ink3);padding:4px 8px;border-radius:5px;
}
.sec-add:hover{background:var(--hover);color:var(--accent)}
.empty{padding:36px 16px;text-align:center;color:var(--ink3);font-size:13px}
.empty b{display:block;color:var(--ink2);font-size:14px;margin-bottom:5px}

/* ---------- drawer ---------- */
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:624px;max-width:92vw;
  background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;transform:translateX(100%);
  transition:transform .16s ease;z-index:40;
}
.drawer.on{transform:none}
.dr-head{
  padding:10px 12px;border-bottom:1px solid var(--line2);
  display:flex;align-items:center;gap:8px;
}
.dr-body{flex:1;overflow-y:auto;padding:14px 16px 40px}
.dr-title{
  width:100%;font-size:21px;font-weight:700;line-height:1.45;background:var(--sunk);
  border:1px solid transparent;border-radius:6px;padding:8px 10px;resize:none;
  font-family:inherit;
}
.dr-title:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.fields{display:grid;grid-template-columns:74px 1fr;gap:9px 10px;align-items:center;margin-top:16px}
.fields label{font-size:12px;color:var(--ink2)}
.fields input,.fields select{
  width:100%;background:var(--sunk);border:1px solid transparent;border-radius:6px;padding:5px 8px;
}
.fields input:focus,.fields select:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.dr-sec{margin-top:20px}
.dr-sec h4{
  margin:0 0 7px;font-size:11.5px;font-weight:700;color:var(--ink3);
  letter-spacing:.06em;text-transform:uppercase;
}
.notes{
  width:100%;min-height:96px;background:var(--sunk);border:1px solid transparent;
  border-radius:6px;padding:8px 10px;resize:vertical;font-family:inherit;line-height:1.7;
}
.notes:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.subs{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px}
/* 行は一段沈めた面に置き、入力欄は白い面にする。背景と入力欄が同じ色で見分けにくかったため */
.subs li{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:7px 8px 8px 6px;position:relative;
  background:var(--bg);border-radius:8px}
/* 工数と期日は2段目。名前の欄を横幅いっぱいに使うため */
.sub-meta{flex-basis:100%;display:flex;align-items:center;gap:7px;padding-left:47px}
.sub-add .sub-meta{padding-left:0}
.subs .grip{
  width:14px;flex:none;color:var(--ink3);opacity:0;cursor:grab;
  text-align:center;font-size:11px;line-height:1;user-select:none;
}
.subs li:hover .grip{opacity:.8}
.subs li.dragging{opacity:.4}
.subs li.drop-before::before,.subs li.drop-after::after{
  content:"";position:absolute;left:10px;right:0;height:2px;background:var(--accent);
}
.subs li.drop-before::before{top:-4px}
.subs li.drop-after::after{bottom:-4px}
.subs input[type=text],.sub-add input[type=text]{
  flex:1;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:6px;
  padding:7px 9px;font-size:13px;color:var(--ink);
}
.subs input[type=text]:focus,.sub-add input[type=text]:focus{outline:none;border-color:var(--accent)}
.subs li.on input[type=text]{color:var(--ink3);text-decoration:line-through}
.sub-est{
  flex:none;width:52px;background:var(--field);border:1px solid var(--line);border-radius:6px;
  padding:7px 5px;font-size:12.5px;color:var(--ink2);text-align:right;
}
.sub-est:focus{outline:none;border-color:var(--accent);color:var(--ink)}
.sub-due{
  flex:none;width:128px;background:var(--field);border:1px solid var(--line);border-radius:6px;
  padding:6px 6px;font-size:12.5px;color:var(--ink2);cursor:pointer;font-family:inherit;
}
.sub-due:focus{outline:none;border-color:var(--accent);color:var(--ink)}
.sub-due::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.7}
.subs .sub-due.over{color:var(--red);font-weight:600}
.subs .sub-due.today{color:var(--amber);font-weight:600}
.subs li.on .sub-due{color:var(--ink3);font-weight:400}
/* 丸いチェック。押すと緑に塗られてチェックが出る */
.sub-cb{
  appearance:none;-webkit-appearance:none;margin:0;flex:none;width:19px;height:19px;
  border:1.5px solid var(--ink3);border-radius:50%;background:var(--field);cursor:pointer;
  display:grid;place-items:center;transition:background .12s,border-color .12s;
}
.sub-cb:hover{border-color:var(--green)}
.sub-cb::after{
  content:"";width:5px;height:9px;border:solid transparent;border-width:0 2px 2px 0;
  transform:translateY(-1px) rotate(45deg);
}
.sub-cb:hover::after{border-color:var(--green)}
.sub-cb:checked{background:var(--green);border-color:var(--green)}
.sub-cb:checked::after{border-color:#fff}
.subs .del{color:var(--ink3);font-size:13px;padding:2px 5px;opacity:.35;flex:none}
.subs li:hover .del{opacity:1}
.subs .del:hover{color:var(--red)}
.sub-add{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:7px 8px 8px;border:1px dashed var(--line);border-radius:8px}
.sub-add input[type=text]{border-color:transparent;background:none}
.sub-add input[type=text]:focus{background:var(--field)}
.sub-add-go{flex:none;font-size:12.5px;padding:6px 11px;border-radius:6px;background:var(--accent);
  color:var(--on-accent);font-weight:600}
.dr-top{display:flex;justify-content:flex-end;margin:-4px 0 6px}
.dr-top .danger{margin-top:0}
.linkout{color:var(--accent);word-break:break-all;font-size:12px}
.danger{color:var(--red);font-size:12px;margin-top:26px}
.danger:hover{text-decoration:underline}
.stamp{font-size:11.5px;color:var(--ink3);margin-top:22px;line-height:1.9}

/* ---------- modal / toast ---------- */
.veil{
  position:fixed;inset:0;background:rgba(16,24,40,.34);z-index:50;
  display:grid;place-items:center;padding:24px;
}
.modal{
  background:var(--panel);border-radius:10px;box-shadow:var(--shadow);
  width:min(680px,100%);max-height:86vh;display:flex;flex-direction:column;
  border:1px solid var(--line);
}
.mo-head{padding:14px 18px;border-bottom:1px solid var(--line2);font-weight:700;font-size:15px}
.mo-body{padding:16px 18px;overflow-y:auto}
.mo-foot{
  padding:12px 18px;border-top:1px solid var(--line2);
  display:flex;gap:9px;justify-content:flex-end;
}
.btn{padding:6px 14px;border-radius:6px;border:1px solid var(--line);color:var(--ink2)}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.map{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;align-items:center}
.map select,.map input{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:6px;padding:5px 8px}
.hint{font-size:12px;color:var(--ink2);margin:0 0 14px;line-height:1.75}
.crow{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.crow>span{font-size:12px;color:var(--ink2);flex:none}
.cpick{display:flex;gap:6px;flex-wrap:wrap}
.cswatch{
  width:20px;height:20px;border-radius:5px;flex:none;
  border:1px solid var(--line);
}
.cswatch:hover{transform:scale(1.12)}
.cswatch.on{box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--ink)}
.prev{
  margin-top:16px;font-size:11.5px;font-family:var(--fm);color:var(--ink2);
  background:var(--sunk);border-radius:6px;padding:10px;max-height:170px;overflow:auto;white-space:pre;
}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;
  box-shadow:var(--shadow);z-index:60;display:flex;align-items:center;gap:14px;font-size:13px;
}
.toast button{color:var(--bg);text-decoration:underline;text-underline-offset:2px;font-weight:600}
.dropzone{
  position:fixed;inset:0;z-index:70;background:rgba(42,111,151,.14);
  border:3px dashed var(--accent);display:grid;place-items:center;
  font-size:18px;font-weight:700;color:var(--accent);
}
/* ボタンの色。設定の「メインカラー / サブカラー」で上書きされる */
:root{--main:#6db52d;--sub:#f29419}
[hidden]{display:none!important}

/* ---------- 週ビュー（左にタスクバー、右に週カレンダー） ---------- */
.week{flex:1;overflow:auto;padding:12px 20px 40px}
.wk-top{display:flex;align-items:center;gap:6px;font-size:13px;position:sticky;top:-12px;z-index:9;
  background:var(--bg);padding:8px 0 10px;margin:-8px 0 0;height:46px;box-sizing:border-box}
.wk-top button{padding:3px 9px;border:1px solid var(--line);border-radius:6px;color:var(--ink2);font-size:12px}
.wk-top button:hover{background:var(--hover);color:var(--ink)}
.wk-range{font-weight:700;margin-left:6px}
.wk-sync{font-size:11.5px;color:var(--ink3)}
.wk-sync b{color:var(--amber);font-weight:600}
/* 「Claude で同期」。検索窓の行の右端。ハタラグリーンに白文字 */
.sync-btn{
  position:absolute;right:20px;top:50%;transform:translateY(calc(-50% - 6px));
  border:0;color:#fff;font-weight:700;font-size:12.5px;
  padding:6px 15px;border-radius:999px;background:var(--main);
}
.sync-btn:hover{filter:brightness(.9)}
.sync-btn:disabled{background:var(--sunk);color:var(--ink2);cursor:default}
/* 同期の結果のポップアップ。画面右上、検索窓の行の下に出す */
.sync-pop{
  position:fixed;top:58px;right:20px;z-index:60;display:flex;align-items:center;gap:10px;
  padding:11px 14px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);
  max-width:440px;animation:syncpop .18s ease-out;
}
.sync-pop.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green)}
.sync-pop.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red)}
.sync-pop-i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;flex:none;
  font-size:12px;font-weight:800;color:#fff}
.sync-pop.ok .sync-pop-i{background:var(--green)}
.sync-pop.err .sync-pop-i{background:var(--red)}
.sync-pop button{margin-left:6px;color:inherit;opacity:.7;padding:0 2px}
.sync-pop button:hover{opacity:1}
@keyframes syncpop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.wk-wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;align-items:start}
.wk-bar{background:var(--sunk);border-radius:10px;padding:10px 8px;position:sticky;top:34px;
  max-height:calc(100vh - 150px);overflow-y:auto}
.wk-bar.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.wk-bar-h{display:flex;justify-content:space-between;font-size:12px;font-weight:700;padding:2px 4px 8px}
.wk-bar-h span{font-weight:400;color:var(--ink3)}
.wk-items{display:flex;flex-direction:column;gap:6px;min-height:20px}
.wk-item{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 9px;
  cursor:grab;font-size:12.5px;line-height:1.45;overflow:hidden;flex:none;box-sizing:border-box}
.wk-item-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.wk-item:hover{border-color:var(--ink3)}
.wk-item.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wk-item.ib{border-left:3px solid var(--accent)}
.wk-ib-tag{color:var(--accent);font-weight:600}
.wk-sep{height:1px;background:var(--line);margin:12px 2px 10px}
.wk-item.sub{border-left:3px solid var(--violet)}
.wk-parent{color:var(--ink2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-item-m{display:flex;gap:6px;flex-wrap:nowrap;margin-top:1px;font-size:11px;color:var(--ink3);
  white-space:nowrap;overflow:hidden}
.wk-item-m > span{flex:none}
.wk-item-m > .wk-parent{flex:0 1 auto;min-width:0}
.wk-more{display:block;width:100%;text-align:left;font-size:12px;color:var(--ink2);padding:10px 4px 6px}
.wk-more:hover{color:var(--accent)}
.wk-hint{font-size:11.5px;color:var(--ink3);padding:6px 4px 0;line-height:1.6}
.wk-cal{background:var(--panel);border:1px solid var(--line);border-radius:10px}
/* 日付と曜日の行は、下にスクロールしても上に貼りついたまま */
.wk-head{position:sticky;top:34px;z-index:7;background:var(--panel);border-radius:10px 10px 0 0;
  border-bottom:1px solid var(--line2);box-shadow:0 1px 0 var(--line2)}
.wk-head,.wk-allday,.wk-grid{display:grid;grid-template-columns:44px repeat(7,minmax(150px,1fr));min-width:max-content}
.wk-head div{padding:7px 6px;font-size:12px;color:var(--ink2);border-left:1px solid var(--line2)}
.wk-head div.today{color:var(--accent);font-weight:700}
.wk-head div.off{color:var(--ink3)}
.wk-allday{border-top:1px solid var(--line2)}
.wk-allday div{border-left:1px solid var(--line2);padding:2px 3px;min-height:6px;display:flex;flex-direction:column;gap:2px}
.wk-chip{font-size:10.5px;background:var(--sunk);color:var(--ink2);border-radius:4px;padding:1px 5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-grid{border-top:1px solid var(--line)}
.wk-hours{position:relative}
.wk-hours span{position:absolute;right:6px;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;transform:translateY(-50%)}
.wk-day{position:relative;border-left:1px solid var(--line2)}
.wk-day.today{background:color-mix(in srgb, var(--accent-bg) 45%, transparent)}
.wk-day.drop{background:color-mix(in srgb, var(--accent-bg) 80%, transparent)}
.wk-blk{position:absolute;border-radius:5px;padding:2px 5px;font-size:11px;line-height:1.35;
  overflow:hidden;box-sizing:border-box}
.wk-blk small{display:block;font-size:11px;opacity:1;font-variant-numeric:tabular-nums}
/* 30分未満は名前と時刻を1行に。2行目がはみ出して下の予定に重なるのを防ぐ */
.wk-blk.short{display:flex;align-items:center;gap:5px;white-space:nowrap;padding-top:1px;padding-bottom:1px}
.wk-blk.short small{display:inline;flex:none}
.wk-blk.meet.mv{cursor:grab}
.wk-blk.meet.mv:hover{border-color:var(--ink3)}
.wk-blk.meet.pending{border-style:dashed;border-color:var(--ink2)}
.wk-blk.meet{background:var(--sunk);color:var(--ink2);border:1px solid var(--line)}
.wk-blk.task{background:var(--violet-bg);color:var(--violet);border:1px solid var(--violet);cursor:grab}
/* 下端のつまみ。乗せると上下の矢印になり、ドラッグで長さ（工数）を変えられる */
.wk-rs{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.wk-rs::after{content:"";position:absolute;left:50%;bottom:2px;width:18px;height:3px;margin-left:-9px;
  border-radius:2px;background:currentColor;opacity:0}
.wk-blk.task:hover .wk-rs::after,.wk-blk.resizing .wk-rs::after{opacity:.6}
.wk-blk.resizing{z-index:6;box-shadow:0 0 0 2px var(--accent)}
.wk-blk.task.pending{border-style:dashed}
.wk-blk.task.done{opacity:.55;text-decoration:line-through}
.wk-blk.task.sel{box-shadow:0 0 0 2px var(--accent)}
.wk-blk.dragging,.wk-item.dragging{opacity:.4}
.wk-ghost{position:absolute;left:2px;right:2px;border:2px solid var(--accent);border-radius:5px;
  background:var(--accent-bg);color:var(--accent);font-size:11px;padding:1px 5px;pointer-events:none;z-index:5}
.wk-now{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:4;pointer-events:none}
.wk-legend{display:flex;gap:14px;font-size:11px;color:var(--ink3);margin-top:8px}
.wk-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
/* ---------- inbox ---------- */
/* 入力欄が多いので、ほかの画面より一回り（約1.3倍）大きくしてある */
.ib{max-width:1080px}
.ib-add input{width:100%;background:none;border:1px dashed var(--line);border-radius:8px;
  padding:11px 13px;font-size:16px;color:var(--ink);margin-bottom:12px}
.ib-add input:focus{outline:none;border-style:solid;border-color:var(--accent);background:var(--panel)}
.ib-row{padding:11px 10px 13px;border-bottom:1px solid var(--line2)}
.ib-row:hover{background:var(--hover)}
.ib-line{display:flex;align-items:center;gap:12px}
.ib-ctl{flex-wrap:wrap;gap:10px;margin-top:8px;padding-left:5px}
.ib-title{flex:1;min-width:0;background:none;border:0;font-size:17px;color:var(--ink);padding:4px 5px;border-radius:5px}
.ib-title:focus{outline:none;background:var(--sunk)}
.ib-when{font-size:14px;color:var(--ink3);flex:none;font-variant-numeric:tabular-nums}
.ib-sel,.ib-f input{font-size:15px;border:1px solid var(--line);border-radius:7px;padding:6px 9px;
  background:var(--field);color:var(--ink2);font-family:inherit}
.ib-sel{max-width:300px}
.ib-sel:disabled{opacity:.5}
.ib-f{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink3)}
.ib-f input[type=number]{width:84px}
.ib-go{font-size:15px;padding:7px 15px;border-radius:7px;background:var(--accent);color:var(--on-accent);font-weight:600}
.ib-go:disabled{background:var(--sunk);color:var(--ink3);cursor:default}
.ib-del{flex:none;color:var(--ink3);padding:3px 8px;border-radius:6px;font-size:16px}
.ib-del:hover{background:var(--red-bg);color:var(--red)}
.ib-hint{font-size:14px;color:var(--ink3);padding:12px 5px;line-height:1.7}
.ib-swatch{background:var(--ink)!important;border-radius:50%!important}
.pitem .ct.ib-ct{color:var(--accent);font-weight:700}
/* ---------- 左上の名前・アイコン ---------- */
.brand{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:.02em;
  font-size:13.5px;color:var(--ink);font-weight:700}
.brand-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{display:inline-grid;place-items:center;border-radius:6px;flex:none;overflow:hidden;line-height:1}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
/* ---------- 設定 ---------- */
.set-open{display:inline-flex;align-items:center;gap:6px}
.set-open svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.set{display:flex;flex-direction:column;gap:14px}
.set-sec{border:1px solid var(--line);border-radius:12px;overflow:hidden}

<script>
"use strict";
/* =========================================================================
   inc.take / backlog — Asana のバックログをモデルにした単一ファイル版
   保存先: 同じフォルダの tasks.json （File System Access API）
           + localStorage ミラー（クラッシュ・未接続時の保険）
   ========================================================================= */

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const uid = p => p + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-3);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LS_DATA = 'inc.take.backlog.data';
const LS_UI   = 'inc.take.backlog.ui';
/* サイドバーの inbox を選んでいるときの UI.project */
const INBOX_P = '~inbox';

/* Slack リスト「task backlog_たけしま」の選択肢に合わせてある。
   セクション名がこのラベルと一致するとき、セクションとステータスは連動する。 */
const STATUS = [
  ['todo',     '未着手',      ''],
  ['ticketed', 'タスク化',    'ticketed'],
  ['doing',    '進行中',      'doing'],
  ['release',  'リリース待ち', 'release'],
  ['done',     '完了',        '']
];
const statusByLabel = l => STATUS.find(s => s[1] === l);
const PRIORITY = [['','—'],['high','高'],['mid','中'],['low','低']];

/* Slack リストと同じ色名を使う。取り込みのときに向こうの割り当てをそのまま持ってくる。 */
const COLORS = ['gray','brown','orange','yellow','green','cyan','blue','indigo','purple','pink','red'];

/* 工数の刻み幅。ここだけ変えれば全体に効く。未設定は null。 */
const EST_STEP = 0.25;
/* 0.35 のような割り切れない刻みだと 0.35*3 = 1.0499999... になるので、
   足し算のたびに小数2桁へ丸めて誤差が積もらないようにする。 */
const round2 = n => Math.round(n * 100) / 100;
function normEstimate(v){
  const n = typeof v === 'number' ? v : parseFloat(v);
  if(!isFinite(n) || n <= 0) return null;
  /* 刻みの半分未満は 0 に落ちてしまうので、最小の1刻みに寄せる */
  return Math.min(100, Math.max(EST_STEP, round2(Math.round(n / EST_STEP) * EST_STEP)));
}
const showHours = h => round2(h) + 'h';
/* サブタスクがあるときは親の工数はサブの合計。未設定が残っていれば件数も返す。 */
function taskHours(t){
  if(t.subtasks.length){
    const set = t.subtasks.filter(x => x.estimate != null);
    return {hours: round2(set.reduce((a, x) => a + x.estimate, 0)),
            unset: t.subtasks.length - set.length, fromSubs: true};
  }
  return {hours: t.estimate || 0, unset: t.estimate == null ? 1 : 0, fromSubs: false};
}
function hoursBadge(t){
  const h = taskHours(t);
  if(!h.hours && h.unset) return '';
  const tip = h.unset ? ('未設定 ' + h.unset + ' 件あり') : (h.fromSubs ? 'サブタスクの合計' : '');
  return '<span class="badge b-est' + (h.unset ? ' partial' : '') + '"' +
    (tip ? ' title="' + tip + '"' : '') + '>' + showHours(h.hours) + (h.unset ? '+' : '') + '</span>';
}
const colorOf = v => COLORS.includes(v) ? v : '';
const colorFg = v => colorOf(v) ? 'var(--sc-' + v + ')' : 'var(--ink3)';
/* プロジェクトの札の色。色が未設定ならグレー */
const projTagStyle = v => 'color:var(--sc-' + (colorOf(v) || 'gray') + ');background:var(--sc-' + (colorOf(v) || 'gray') + '-bg)';
/* 横断ビューの区切りは実体が無いので、同じ名前のセクションが持つ色を借りる */
function colorForSectionName(name){
  for(const p of S.projects)
    for(const sec of p.sections)
      if(sec.name === name && sec.color) return sec.color;
  return '';
}
const colorBg = v => colorOf(v) ? 'var(--sc-' + v + '-bg)' : 'var(--sunk)';
const statusLabel = v => (STATUS.find(s=>s[0]===v)||STATUS[0])[1];
const statusMod   = v => (STATUS.find(s=>s[0]===v)||STATUS[0])[2];
const priLabel    = v => (PRIORITY.find(p=>p[0]===v)||PRIORITY[0])[1];

/* ---------- 日付 ---------- */
function todayISO(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
}
function daysFromToday(iso){
  if(!iso) return null;
  const a = new Date(todayISO()+'T00:00:00'), b = new Date(iso+'T00:00:00');
  if(isNaN(b)) return null;
  return Math.round((b-a)/864e5);
}
function dueLabel(iso){
  const d = daysFromToday(iso);
  if(d===null) return '';
  if(d===0) return '今日';
  if(d===1) return '明日';
  if(d===-1) return '昨日';
  const [,m,dd] = iso.split('-');
  return `${+m}/${+dd}`;
}
function dueClass(iso){
  const d = daysFromToday(iso);
  if(d===null) return '';
  if(d<0) return 'over';
  if(d===0) return 'today';
  if(d<=7) return 'soon';
  return '';
}

/* =========================================================================
   State
   ========================================================================= */
function blankState(){
  const pid = uid('p_');
  return {
    version: 1,
    updatedAt: new Date().toISOString(),
    projects: [{
      id: pid, name: '個人バックログ',
      sections: [
        {id: uid('s_'), name: '今週'},
        {id: uid('s_'), name: '次にやる'},
        {id: uid('s_'), name: 'いつか / 保留'}
      ]
    }],
    tasks: []
  };
}
function normalize(st){
  st = st && typeof st === 'object' ? st : {};
  const out = {
    version: 1,
    updatedAt: st.updatedAt || new Date().toISOString(),
    projects: Array.isArray(st.projects) ? st.projects : [],
    tasks: Array.isArray(st.tasks) ? st.tasks : [],
    /* inbox … Slack の自分宛てDMなどから拾った、まだプロジェクトに振り分けていないタスク。
       inboxSeen … inbox.json から取り込み済みの id。振り分けたあとに二重に入らないようにする */
    inbox: (Array.isArray(st.inbox) ? st.inbox : [])
      .filter(x => x && x.title)
      .map(x => ({id: x.id || uid('i_'), title: String(x.title), receivedAt: x.receivedAt || '', src: x.src || '',
                   pid: x.pid || '', parent: x.parent || '', due: x.due || '', estimate: normEstimate(x.estimate)})),
    inboxSeen: (Array.isArray(st.inboxSeen) ? st.inboxSeen : []).slice(-1000),
    /* eventMoves … ボードで動かした「自分だけの予定」。{eventId: {date, start, end, setAt}}。
       同期でカレンダーに反映されたら消える */
    eventMoves: Object.fromEntries(Object.entries(st.eventMoves && typeof st.eventMoves === 'object' ? st.eventMoves : {})
      .filter(([, v]) => v && /^\d{4}-\d{2}-\d{2}$/.test(v.date || '') && /^\d{2}:\d{2}$/.test(v.start || '') && /^\d{2}:\d{2}$/.test(v.end || '')))
  };
  out.settings = normSettings(st.settings);
  out.projects = out.projects.map(p => ({
    id: p.id || uid('p_'),
    name: p.name || '無題のプロジェクト',
    color: colorOf(p.color),
    sections: (Array.isArray(p.sections) && p.sections.length ? p.sections : [{name:'バックログ'}])
      .map(s => ({id: s.id || uid('s_'), name: s.name || 'セクション', color: colorOf(s.color)}))
  }));
  if(!out.projects.length) out.projects = blankState().projects;
  /* どのプロジェクトにも、ステータスの5つのセクションを必ず持たせる（タスクが無くても表示するため）。
     自分で作った任意名のセクションはそのまま残し、足りないものだけ正しい位置に差し込む */
  for(const proj of out.projects) for(const [, label] of STATUS) ensureStatusSection(proj, label);
  const validP = new Set(out.projects.map(p=>p.id));
  let n = 0;
  out.tasks = out.tasks.map(t => {
    const pid = validP.has(t.projectId) ? t.projectId : out.projects[0].id;
    const proj = out.projects.find(p=>p.id===pid);
    const sid = proj.sections.some(s=>s.id===t.sectionId) ? t.sectionId : proj.sections[0].id;
    return {
      id: t.id || uid('t_'),
      projectId: pid, sectionId: sid,
      title: t.title || '',
      notes: t.notes || '',
      status: STATUS.some(s=>s[0]===t.status) ? t.status
              : ({waiting:'release', blocked:'ticketed', scheduled:'ticketed'}[t.status] || 'todo'),
      priority: PRIORITY.some(p=>p[0]===t.priority) ? t.priority : '',
      due: t.due || '',
      url: t.url || '',
      estimate: normEstimate(t.estimate),
      schedule: normSchedule(t.schedule),
      subtasks: (Array.isArray(t.subtasks) ? t.subtasks : [])
        .map(s => ({id: s.id || uid('k_'), title: s.title || '', done: !!s.done,
                    due: s.due || '', estimate: normEstimate(s.estimate),
                    schedule: normSchedule(s.schedule)})),
      createdAt: t.createdAt || new Date().toISOString(),
      completedAt: t.completedAt || null,
      prevStatus: STATUS.some(x => x[0] === t.prevStatus) ? t.prevStatus : '',
      order: typeof t.order === 'number' ? t.order : (n += 1000)
    };
  });
  return out;
}

let S  = blankState();
let UI = {project:'*', q:'', filter:'all', showDone:false, collapsed:{},
          theme:'auto', view:'list', drafts:{}};
let selected = null;
let lastDeleted = null;

function loadUI(){
  try{ Object.assign(UI, JSON.parse(localStorage.getItem(LS_UI) || '{}')); }catch(e){}
  UI.drafts = {};
  /* 絞り込みと検索は持ち越さない。開き直したときに黙って絞られたままだと、
     タスクが消えたようにしか見えない。 */
  UI.filter = 'all';
  UI.q = '';
  if(UI.view !== 'board' && UI.view !== 'week') UI.view = 'list';
  if(UI.theme === 'light' || UI.theme === 'dark') document.documentElement.dataset.theme = UI.theme;
}
function saveUI(){
  try{ localStorage.setItem(LS_UI, JSON.stringify(UI)); }catch(e){}
}

/* =========================================================================
   永続化 — tasks.json (File System Access) + localStorage ミラー
   ========================================================================= */
const Store = (() => {
  let handle = null;
  let mode = 'local';          // 'file' | 'local'
  let saveTimer = null;
  const FSA = typeof window.showSaveFilePicker === 'function';

  /* IndexedDB に FileSystemFileHandle を保存 */
  /* 決して固まらせない。IndexedDB が blocked のまま返ってこないと
     boot が終わらず、画面が真っ白のまま何も出なくなる。 */
  function guard(promise, ms, fallback){
    return Promise.race([
      promise,
      new Promise(res => setTimeout(() => res(fallback), ms))
    ]);
  }
  function idb(){
    return new Promise((res, rej) => {
      const r = indexedDB.open('inc.take.backlog', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror   = () => rej(r.error);
      r.onblocked = () => rej(new Error('indexedDB blocked'));
    });
  }
  async function idbGet(k){
    try{
      const db = await guard(idb(), 2000, null);
      if(!db) return null;
      return await guard(new Promise((res, rej) => {
        const q = db.transaction('kv').objectStore('kv').get(k);
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      }), 2000, null);
    }catch(e){ return null; }
  }
  async function idbSet(k, v){
    try{
      const db = await guard(idb(), 2000, null);
      if(!db) return;
      await new Promise((res, rej) => {
        const q = db.transaction('kv','readwrite').objectStore('kv').put(v, k);
        q.onsuccess = () => res(); q.onerror = () => rej(q.error);
      });
    }catch(e){}
  }

  function mirror(){
    try{ localStorage.setItem(LS_DATA, JSON.stringify(S)); }catch(e){}
  }

  /* server.py が動いていれば、保存はサーバーに任せる。
     ブラウザの書き込み許可が要らなくなるので、接続の操作そのものが消える。 */
  async function detectServer(){
    try{
      const r = await fetch('api/ping', {cache:'no-store'});
      if(!r.ok) return false;
      const j = await r.json();
      return !!(j && j.ok);
    }catch(e){ return false; }
  }
  async function serverSave(){
    try{
      const r = await fetch('api/save', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(S)
      });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if(!j || !j.ok) throw new Error((j && j.error) || 'save failed');
      return true;
    }catch(e){
      paint('保存できません（サーバーが止まっています）', 'warn');
      return false;
    }
  }
  async function writeFile(){
    if(!handle) return false;
    try{
      const w = await handle.createWritable();
      await w.write(JSON.stringify(S, null, 2));
      await w.close();
      return true;
    }catch(e){
      mode = 'local'; paint('書き込めません', 'warn', '再接続', connect);
      return false;
    }
  }

  function save(){
    S.updatedAt = new Date().toISOString();
    mirror();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      if(mode === 'server'){
        if(await serverSave()) paint('tasks.json に保存済み', 'ok');
        return;
      }
      if(mode === 'file' && await writeFile()) paint('tasks.json に保存済み', 'ok');
    }, 500);
  }
  async function flush(){
    clearTimeout(saveTimer);
    mirror();
    if(mode === 'server'){ await serverSave(); return; }
    if(mode === 'file') await writeFile();
  }

  function paint(text, kind, btnLabel, btnFn){
    $('#storeText').textContent = text;
    $('#dot').className = 'dot' + (kind ? ' ' + kind : '');
    const b = $('#storeBtn');
    if(btnLabel){ b.hidden = false; b.textContent = btnLabel; b.onclick = btnFn; }
    else b.hidden = true;
  }

  /* 接続してよいファイルかを必ず検査する。
     taskboard 形式でないファイルを掴んだまま mode='file' にすると、
     次の保存でそのファイルを空データで上書きして壊してしまう。 */
  async function adopt(h, {read = true} = {}){
    const LF = String.fromCharCode(10);
    let pushLocal = false;
    if(read){
      let txt = '';
      try{
        txt = await (await h.getFile()).text();
      }catch(e){
        alert('ファイルを読めませんでした。' + LF + e.message);
        return false;
      }
      if(txt.trim()){
        let j = null;
        try{ j = JSON.parse(txt); }
        catch(e){
          alert(h.name + ' は JSON として読めませんでした。接続しません。' + LF + e.message);
          return false;
        }
        if(isSlackListFile(j)){
          alert(h.name + ' は Slack リストの書き出しファイルです。' + LF + LF +
                'ここで接続するとこのファイルを壊してしまうので接続しません。' + LF +
                '取り込みたいときは、このファイルを画面にドラッグしてください。' + LF + LF +
                '保存先に選ぶのは taskboard フォルダの tasks.json です。');
          return false;
        }
        if(!isTaskboardFile(j)){
          alert(h.name + ' は taskboard のデータファイルではありません。接続しません。' + LF + LF +
                'taskboard フォルダの tasks.json を選んでください。');
          return false;
        }
        const incoming = normalize(j);
        /* 未接続のあいだブラウザ内で編集していた分を、黙って捨てない */
        const localCount = Array.isArray(S.tasks) ? S.tasks.length : 0;
        const localNewer = localCount > 0 && ts(S.updatedAt) > ts(incoming.updatedAt);
        if(localNewer){
          pushLocal = confirm(
`このブラウザに、${h.name} より新しい未保存の変更があります。
［OK］いま画面に出ている内容を残し、${h.name} に書き込む（${localCount} 件）
［キャンセル］${h.name} の内容を読み込む（${incoming.tasks.length} 件。画面の変更は失われます）`);
        }
        if(!pushLocal) S = incoming;
      }
    }
    handle = h;
    await idbSet('handle', h);
    mode = 'file';
    paint(h.name + ' に接続', 'ok');
    mirror();
    if(!read || pushLocal) await writeFile();
    return true;
  }

  /* ユーザー操作から呼ぶ（ピッカーはジェスチャ必須） */
  async function connect(){
    if(!FSA){
      alert('このブラウザは tasks.json への直接保存に対応していません。\n' +
            'Chrome / Edge で start.bat から開くか、「書き出し」でJSONを保存してください。');
      return;
    }
    try{
      const [h] = await window.showOpenFilePicker({
        types:[{description:'JSON', accept:{'application/json':['.json']}}],
        multiple:false
      });
      if(await adopt(h, {read:true})){ selected = null; renderAll(); }
    }catch(e){ /* キャンセル */ }
  }
  async function createNew(){
    if(!FSA){ exportJSON(); return; }
    try{
      const h = await window.showSaveFilePicker({
        suggestedName:'tasks.json',
        types:[{description:'JSON', accept:{'application/json':['.json']}}]
      });
      await adopt(h, {read:false});
      renderAll();
    }catch(e){}
  }

  /* 隣の tasks.json を読む。start.bat 経由の http でのみ成功し、
     file:// では CORS で失敗するので、失敗は握りつぶして null を返す。 */
  async function fetchFile(){
    try{
      const r = await fetch('tasks.json?t=' + Date.now(), {cache:'no-store'});
      if(!r.ok) return null;
      const j = await r.json();
      if(j && Array.isArray(j.projects) && j.projects.length) return j;
    }catch(e){}
    return null;
  }
  const taskCount = st => (st && Array.isArray(st.tasks)) ? st.tasks.length : 0;
  /* 更新時刻は書き手によって形式が違う（server.py は +09:00、ブラウザは Z）。
     文字列のまま比べると桁の並びで勝敗が決まって嘘になるので、必ず時刻に直す。 */
  const ts = v => { const n = Date.parse(v || ''); return isNaN(n) ? 0 : n; };

  /* ブラウザ内のキャッシュと tasks.json のどちらを採用するか。
     ここを間違えると、一度空で開いた履歴が中身のある tasks.json を隠してしまう。
       - キャッシュが空          → ファイル（黙って採用）
       - ファイルの方が新しい    → どちらを使うか確認する
       - それ以外                → キャッシュ（未保存の編集を守る） */
  function pick(cached, file){
    if(!file)               return {use: cached, from: 'cache', prompted: false};
    if(!cached)             return {use: file,   from: 'file',  prompted: false};
    if(!taskCount(cached))  return {use: file,   from: 'file',  prompted: false};
    if(ts(file.updatedAt) > ts(cached.updatedAt)){
      const takeFile = confirm(
`tasks.json の方が、このブラウザに残っている内容より新しいです。
［OK］tasks.json を読み込む（${taskCount(file)} 件）
［キャンセル］このブラウザの内容を使う（${taskCount(cached)} 件）`
      );
      return {use: takeFile ? file : cached, from: takeFile ? 'file' : 'cache', prompted: true};
    }
    return {use: cached, from: 'cache', prompted: false};
  }

  async function boot(){
    /* localStorage から先に復帰（常に手元にある） */
    let cached = null;
    try{ cached = JSON.parse(localStorage.getItem(LS_DATA) || 'null'); }catch(e){}

    /* start.bat 経由なら server.py が動いている。この場合は許可も接続も要らない。 */
    if(await detectServer()){
      mode = 'server';
      /* サーバーで開いたときは、必ず tasks.json を正本にする。ブラウザに残った内容とは比べない。
         以前はここで「どちらを使うか」を聞いていて、古いブラウザの内容を選ぶと
         tasks.json がまるごと昔の状態に戻ってしまった（2026-10-02 に実際に起きた） */
      const file = await fetchFile();
      S = normalize(file || cached || blankState());
      try{ localStorage.setItem(LS_DATA, JSON.stringify(S)); }catch(e){}
      paint('tasks.json に自動保存', 'ok');
      return;
    }

    const h = await idbGet('handle');
    if(h && FSA){
      let perm = 'prompt';
      try{ perm = await h.queryPermission({mode:'readwrite'}); }catch(e){}
      if(perm === 'granted'){
        if(!await adopt(h, {read:true})){
          /* 掴んでいたのが taskboard のファイルではなかった。
             ここで黙って return すると「読み込み中」のまま、選び直すボタンも出ない。 */
          await idbSet('handle', null);
          const c0 = pick(cached, await fetchFile());
          if(c0.use) S = normalize(c0.use);
          paint('接続先を選び直してください', 'warn', 'tasks.json を選ぶ', connect);
          return;
        }
        /* ローカルキャッシュの方が新しければ知らせる（空のキャッシュは無視する） */
        if(cached && taskCount(cached) && ts(cached.updatedAt) > ts(S.updatedAt)){
          const keep = confirm(
`このブラウザに、tasks.json より新しい未保存の変更があります。
［OK］ローカルの新しい方を使う（次の保存で tasks.json に反映）
［キャンセル］tasks.json の内容を使う`
          );
          if(keep){ S = normalize(cached); save(); }
        }
        return;
      }
      /* 権限が切れている：ワンクリックで再取得。それまでは中身を出しておく */
      const c1 = pick(cached, await fetchFile());
      if(c1.use) S = normalize(c1.use);
      if(c1.prompted && c1.from === 'cache') save();
      handle = h;
      paint('tasks.json 未接続', 'warn', '接続する', async () => {
        try{
          if(await h.requestPermission({mode:'readwrite'}) === 'granted'){
            if(await adopt(h, {read:true})){ selected = null; renderAll(); }
            else{
              await idbSet('handle', null);
              paint('接続先を選び直してください', 'warn', 'tasks.json を選ぶ', connect);
            }
          }
        }catch(e){}
      });
      return;
    }

    const c2 = pick(cached, await fetchFile());
    if(c2.use) S = normalize(c2.use);
    if(c2.prompted && c2.from === 'cache') save();
    paint(
      c2.from === 'file' ? 'tasks.json を表示中（未接続）'
        : (FSA ? 'ブラウザ内のみ' : 'ブラウザ内のみ（この環境は直接保存に非対応）'),
      'warn',
      FSA ? (c2.from === 'file' ? '接続して保存できるようにする' : 'tasks.json に接続') : null,
      FSA ? connect : null
    );
  }

  return {boot, save, flush, connect, createNew, paint,
          get mode(){ return mode; }, get fsa(){ return FSA; }};
})();

const save = () => Store.save();

/* =========================================================================
   照会ヘルパー
   ========================================================================= */
const projById = id => S.projects.find(p => p.id === id);
const taskById = id => S.tasks.find(t => t.id === id);
function secName(pid, sid){
  const p = projById(pid); if(!p) return '';
  const s = p.sections.find(x => x.id === sid);
  return s ? s.name : '';
}
const isDone = t => t.status === 'done';
/* 「完了」という名前の区切りは、終わったものを置いておく場所なので中身を常に出す。
   そこ以外に居る完了タスクだけが「完了も表示」の対象になる。 */
const inDoneSection = t => secName(t.projectId, t.sectionId) === statusLabel('done');
const isVisibleDespiteDone = t => !isDone(t) || UI.showDone || inDoneSection(t);

function matchFilter(t){
  if(!isVisibleDespiteDone(t)) return false;
  if(UI.q){
    const q = UI.q.toLowerCase();
    if(!((t.title||'') + ' ' + (t.notes||'')).toLowerCase().includes(q)) return false;
  }
  const d = daysFromToday(t.due);
  switch(UI.filter){
    /* 完了の出し分けは先頭の showDone だけで決める。
       ここで !isDone を重ねると、フィルタ選択中はチェックが無視される。 */
    case 'over':  return d !== null && d < 0;
    case 'today': return d !== null && d <= 0;
    case 'week':  return d !== null && d <= 7;
    case 'nodue': return !t.due;
    default:      return true;
  }
}
function visibleTasks(pid){
  return S.tasks
    .filter(t => (pid === '*' || t.projectId === pid) && matchFilter(t))
    .sort((a,b) => a.order - b.order);
}
function counts(){
  /* 数字はすべて「まだ終わっていない件数」に統一する。サイドバーと同じ意味。
     完了列は参照用に出しているだけなので、ここには数えない
     （その列の件数は列見出しに出る）。 */
  const base = S.tasks.filter(t => !isDone(t));
  const c = {all: base.length, over:0, today:0, week:0, nodue:0};
  for(const t of base){
    const d = daysFromToday(t.due);
    if(!t.due){ c.nodue++; continue; }
    if(d < 0) c.over++;
    if(d <= 0) c.today++;
    if(d <= 7) c.week++;
  }
  return c;
}

function renderTop(){
  const t = $('#projTitle');
  const p = projById(UI.project);
  t.value = UI.project === '*' ? 'すべてのタスク' : (p ? p.name : '');
  t.readOnly = UI.project === '*';

  const c = counts();
  const F = [
    ['all','すべて', c.all, false],
    ['over','期限切れ', c.over, true],
    ['today','今日まで', c.today, false],
    ['week','今週', c.week, false],
    ['nodue','期日なし', c.nodue, false]
  ];
  let html = F.map(([k, label, n, alert]) =>
    `<button class="chip${UI.filter===k?' on':''}${alert&&n>0?' alert':''}" data-f="${k}">
       ${label}<span class="n">${n}</span></button>`).join('');
  html += `<span class="sep"></span>
    <label class="toggle"><input type="checkbox" id="showDone"${UI.showDone?' checked':''}> 完了も表示</label>`;
  $('#chips').innerHTML = html;

  /* 絞り込みで何件隠れているかを必ず見せる。黙って消えたように見せない。 */
  const scope = S.tasks.filter(x => UI.project === '*' || x.projectId === UI.project);
  const shown = scope.filter(matchFilter).length;
  const hiddenByDone = scope.filter(x => !isVisibleDespiteDone(x)).length;
  const hidden = scope.length - shown - hiddenByDone;
  const note = $('#filterNote');
  if((UI.filter !== 'all' || UI.q) && hidden > 0){
    const what = [];
    if(UI.filter !== 'all') what.push('「' + (F.find(f => f[0] === UI.filter) || [,UI.filter])[1] + '」');
    if(UI.q) what.push('検索「' + esc(UI.q) + '」');
    note.innerHTML = what.join('と') + 'で絞り込み中。' + hidden +
      ' 件が隠れています。<button id="clearFilter">絞り込みを解除</button>';
    note.hidden = false;
    $('#clearFilter').onclick = () => {
      UI.filter = 'all'; UI.q = ''; $('#search').value = '';
      saveUI(); renderTop(); renderList();
    };
  }else{
    note.hidden = true; note.innerHTML = '';
  }
  $('#showDone').onchange = e => {
    UI.showDone = e.target.checked; saveUI();
    renderTop(); renderList(); renderSide();
  };
  $$('#vswitch button').forEach(b => b.classList.toggle('on', b.dataset.view === UI.view));
  const inWeek = UI.view === 'week' && UI.project !== INBOX_P;
  $('#btnWeek').classList.toggle('back', inWeek);
  $('#btnWeek').textContent = inWeek ? 'Backlog' : 'カレンダーに追加';
  $('#btnWeek').title = inWeek ? 'Backlog に戻る' : '週カレンダーを開いて、タスクを時間に置く';
  /* 同期ボタンは週カレンダーを開いているときだけ、Backlog ボタンの隣に出す */
  $('#btnSync').disabled = syncRunning();
  $('#btnSync').textContent = syncRunning() ? '同期中…（1〜2分）' : 'Claude で同期';
  $('#btnCollapse').hidden = UI.view !== 'list';
  if(UI.project === INBOX_P){
    t.value = 'inbox'; t.readOnly = true;
    $('#chips').hidden = true; note.hidden = true;
    $('#vswitch').hidden = true; $('#btnCollapse').hidden = true;
    return;
  }
  /* 週カレンダーは別ページのように見せたいので、リスト / Backlog のタブを隠す（戻るのは右上の Backlog ボタン） */
  $('#vswitch').hidden = UI.view === 'week';
  /* 週ビューの左のタスクバーは「未完了・時刻未定」に固定なので、チップは効かない */
  $('#chips').hidden = UI.view === 'week';
  if(UI.view === 'week') note.hidden = true;
}

   ========================================================================= */
/* opt.showProject … プロジェクト名を添えるか（横断ビュー用）
   opt.showStatus  … ステータスのバッジを出すか。
                     セクション名がステータス名そのものの場合は見出しと重複するので出さない */
function rowHTML(t, opt){
  const showProject = !!(opt && opt.showProject);
  const showStatus  = !(opt && opt.showStatus === false);
  const done = isDone(t);
  const subs = t.subtasks.length;
  const subsDone = t.subtasks.filter(s => s.done).length;
  const subsLate = t.subtasks.some(s => !s.done && s.due && daysFromToday(s.due) < 0);
  const dc = dueClass(t.due);
  let meta = '';
  if(showProject){
    const p = projById(t.projectId);
    if(p) meta += `<span class="proj-tag" style="${projTagStyle(p.color)}">${esc(p.name)}</span>`;
  }
  if(subs) meta += `<span class="badge b-sub${subsLate?' late':''}"`
    + (subsLate ? ' title="期限切れのサブタスクがあります"' : '')
    + `>${subsDone}/${subs}</span>`;
  if(t.url) meta += `<a class="b-link" href="${esc(t.url)}" target="_blank" rel="noopener" title="出典を開く">↗</a>`;
  if(t.status !== 'todo' && t.status !== 'done' && showStatus)
    meta += `<span class="badge b-st b-st-${statusMod(t.status)}">${statusLabel(t.status)}</span>`;
  if(t.priority) meta += `<span class="badge b-pri-${t.priority}">${priLabel(t.priority)}</span>`;
  /* 工数: サブタスクがあるときは合計なので読み取りだけ。無ければその場で入力できる */
  if(subs) meta += hoursBadge(t);
  else meta += `<label class="row-est" title="工数（${EST_STEP}h 刻み）"><input type="number" data-act="rowest"
    step="${EST_STEP}" min="0" max="100" value="${t.estimate == null ? '' : t.estimate}" placeholder="—"><span>h</span></label>`;
  /* 期日: 押すとカレンダーが開く。空でも欄は出す（ここから設定できるように） */
  meta += `<input type="date" class="row-due ${t.due && !done ? dc : ''}${t.due ? '' : ' nodue'}" data-act="rowdue"
    value="${esc(t.due)}" title="期日（クリックでカレンダー）">`;

  return `<div class="row${done?' done':''}${selected===t.id?' sel':''}" data-t="${esc(t.id)}">
    <span class="grip" title="ドラッグで並べ替え">⋮⋮</span>
    <button class="cb" data-act="toggle" title="完了/未完了">✓</button>
    <input class="t-title" data-act="title" value="${esc(t.title)}" placeholder="無題のタスク">
    <span class="meta">${meta}</span>
    <button class="open" data-act="open">詳細</button>
  </div>`;
}

/* 「すべてのタスク」用のまとめ方。
   プロジェクトをまたいで同じ名前のセクションを1つに束ね、
   未着手 → タスク化 → 進行中 → リリース待ち → 完了 の順に並べる。
   ステータス名でないセクションは、最初に現れた順でそのあとに続ける。 */
function sectionGroups(){
  const rows = visibleTasks('*');
  const rank = n => {
    const i = STATUS.findIndex(x => x[1] === n);
    return i < 0 ? 99 : i;
  };
  const seen = new Map();
  /* ステータスの5つは、どのプロジェクトにその区切りが無くても必ず並べる。
     未着手から完了までが常に見えていないと、ボードで移す先が無くなる。
     （リストビューは空の区切りを畳んで出さないので邪魔にならない） */
  for(const st of STATUS) seen.set(st[1], seen.size);
  for(const p of S.projects)
    for(const sec of p.sections)
      if(!seen.has(sec.name)) seen.set(sec.name, seen.size);

  return [...seen.keys()]
    .sort((a,b) => (rank(a) - rank(b)) || (seen.get(a) - seen.get(b)))
    .map(name => ({
      name,
      isStatus: !!statusByLabel(name),
      tasks: rows.filter(t => secName(t.projectId, t.sectionId) === name)
    }));
}

/* 横断ビューでタスクを足すときの行き先プロジェクト */

function cardHTML(t, showProject){
  const done = isDone(t);

  const subsDone = t.subtasks.filter(s => s.done).length;
  const subsLate = t.subtasks.some(s => !s.done && s.due && daysFromToday(s.due) < 0);
  let meta = '';
  if(showProject){
    const p = projById(t.projectId);
    if(p) meta += '<span class="proj-tag" style="' + projTagStyle(p.color) + '">' +
      esc(p.name) + '</span>';
  }
  /* 工数・期日はリストの行と同じ欄。その場で変えられる */
  meta += subs ? hoursBadge(t)
    : '<label class="row-est" title="工数（' + EST_STEP + 'h 刻み）"><input type="number" data-act="rowest" step="' + EST_STEP +
      '" min="0" max="100" value="' + (t.estimate == null ? '' : t.estimate) + '" placeholder="—"><span>h</span></label>';
  meta += '<input type="date" class="row-due ' + (t.due && !done ? dueClass(t.due) : '') + (t.due ? '' : ' nodue') +
    '" data-act="rowdue" value="' + esc(t.due) + '" title="期日（クリックでカレンダー）">';
  if(t.priority) meta += '<span class="badge b-pri-' + t.priority + '">' + priLabel(t.priority) + '</span>';
  if(subs) meta += '<span class="badge b-sub' + (subsLate ? ' late' : '') + '"' +
    (subsLate ? ' title="期限切れのサブタスクがあります"' : '') + '>' + subsDone + '/' + subs + '</span>';
  if(t.url) meta += '<a class="b-link" href="' + esc(t.url) +
    '" target="_blank" rel="noopener" title="参照リンクを開く">↗</a>';
  if(t.notes) meta += '<span class="b-note" title="メモあり">≡</span>';

  return '<div class="card' + (done ? ' done' : '') + (selected === t.id ? ' sel' : '') +
    '" data-t="' + esc(t.id) + '">' +
      '<div class="card-top">' +
        '<button class="cb" data-act="toggle" title="完了/未完了">✓</button>' +
        '<input class="card-title" data-act="title" value="' + esc(t.title) +
          '" placeholder="無題のタスク" title="クリックして名前を編集">' +
      '</div>' +
      (meta ? '<div class="card-meta">' + meta + '</div>' : '') +
    '</div>';
}

const colHours = list => round2(list.reduce((n, t) => n + taskHours(t).hours, 0));

function renderBoard(el){
  const pid = UI.project;
  let cols = [];

function nextOrder(pid, sid){
  const mine = S.tasks.filter(t => t.projectId === pid && t.sectionId === sid);
  return mine.length ? Math.max(...mine.map(t => t.order)) + 1000 : 1000;
}
function addTask(pid, sid, title){
  title = (title || '').trim();
  if(!title) return null;
  const t = {
    id: uid('t_'), projectId: pid, sectionId: sid, title,
    notes:'', status:'todo', priority:'', due:'', url:'', estimate: null,
    subtasks:[], createdAt: new Date().toISOString(), completedAt: null,
    order: nextOrder(pid, sid)
  };
  S.tasks.push(t);
  syncStatusToSection(t);      /* 「進行中」の列に足したら status も進行中にする */
  save();
  return t;
}
/* ステータス変更はここに集約する。
   いま入っているセクションがステータス名のセクション（＝Slack のボード列と同じ使い方）なら、
   対応するセクションへ移動もする。自分で作った任意名のセクションは動かさない。 */
function setStatus(t, v, opt){
  const moveSection = !opt || opt.moveSection !== false;
  if(v === 'done' && t.status !== 'done'){
    t.prevStatus = t.status;
    t.completedAt = new Date().toISOString();
  }
  if(v !== 'done') t.completedAt = null;
  t.status = v;

  if(!moveSection) return;
  const p = projById(t.projectId); if(!p) return;
  const cur = p.sections.find(s => s.id === t.sectionId);
  if(!cur || !statusByLabel(cur.name)) return;      /* 任意名のセクションには触らない */
  const dest = ensureStatusSection(p, statusLabel(v));
  if(dest.id !== t.sectionId){
    t.sectionId = dest.id;
    t.order = nextOrder(t.projectId, dest.id);
  }
}

/* ステータス名のセクションを、無ければ STATUS の並び順どおりの位置に作る。
   取り込み時点で使われていなかった列も、そのステータスにした瞬間に生える。 */
function ensureStatusSection(p, label){
  const found = p.sections.find(s => s.name === label);
  if(found) return found;
  const rank = l => { const i = STATUS.findIndex(x => x[1] === l); return i < 0 ? 99 : i; };
  const mine = rank(label);
  let at = p.sections.length;
  for(let i = 0; i < p.sections.length; i++){
    const r = rank(p.sections[i].name);
    if(r !== 99 && r > mine){ at = i; break; }
  }
  const sec = {id: uid('s_'), name: label};
  p.sections.splice(at, 0, sec);
  return sec;
}
/* セクション名がステータス名なら、そこへ移した時点でステータスも合わせる */
function syncStatusToSection(t){
  const p = projById(t.projectId); if(!p) return;
  const sec = p.sections.find(s => s.id === t.sectionId); if(!sec) return;
  const st = statusByLabel(sec.name);
  if(st && st[0] !== t.status) setStatus(t, st[0], {moveSection:false});
}
function toggleDone(t){
  if(isDone(t)){
    const back = (t.prevStatus && t.prevStatus !== 'done') ? t.prevStatus : 'todo';
    delete t.prevStatus;
    setStatus(t, back);
  }else{
    setStatus(t, 'done');
  }
  save();
}
function deleteTask(id){
  const i = S.tasks.findIndex(t => t.id === id);
  if(i < 0) return;
  lastDeleted = {task: S.tasks[i], at: Date.now()};
  S.tasks.splice(i, 1);
  if(selected === id) selected = null;
  save(); renderAll();
  toast('「' + (lastDeleted.task.title || '無題') + '」を削除しました', '元に戻す', () => {
    S.tasks.push(lastDeleted.task); lastDeleted = null; save(); renderAll();
  });
}

function parseCSV(text){
  const rows = []; let row = [], field = '', i = 0, inQ = false;
  text = text.replace(/^﻿/, '');
  while(i < text.length){
    const c = text[i];
    if(inQ){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if(c === '"'){ inQ = true; i++; continue; }
    if(c === ','){ row.push(field); field = ''; i++; continue; }
    if(c === '\r'){ i++; continue; }
    if(c === '\n'){ row.push(field); field = ''; rows.push(row); row = []; i++; continue; }
    field += c; i++;
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

/* 任意の文字列 → ステータス / 優先度 / 日付 */
function guessStatus(v){
  const s = (v||'').toLowerCase();
  if(/未着手|not started|todo|backlog/.test(s)) return 'todo';
  if(/完了|done|complete|済|closed/.test(s)) return 'done';
  if(/リリース待ち|release|waiting|review|pending|待ち/.test(s)) return 'release';
  if(/進行|着手|doing|progress|作業中/.test(s)) return 'doing';
  if(/タスク化|起票|ticket|planned/.test(s)) return 'ticketed';
  return 'todo';
}
function guessPriority(v){
  const s = (v||'').toLowerCase();
  if(/高|high|urgent|p0|p1|至急/.test(s)) return 'high';
  if(/中|mid|medium|normal|p2/.test(s)) return 'mid';
  if(/低|low|p3|p4/.test(s)) return 'low';
  return '';
}
function guessDate(v){
  v = (v||'').trim();
  if(!v) return '';
  let m = v.match(/(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})/);
  if(m) return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  const d = new Date(v);
  if(!isNaN(d)) return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  return '';
}

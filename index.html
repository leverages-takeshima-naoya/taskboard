/* ---------- Slack リストの書き出し JSON を、表の形にほどく ---------- */
function parseSlackList(obj){
  const cols = obj.columns || [];
  const label = {};
  const colorByLabel = {};        /* Slack の色名をそのまま持ってくる */
  for(const c of cols){
    if(c.type === 'select' && c.options && Array.isArray(c.options.choices))
      for(const ch of c.options.choices){
        label[ch.value] = ch.label;
        if(colorOf(ch.color)) colorByLabel[ch.label] = ch.color;
      }
  }
  const header = cols.map((c,i) => c.name || c.id || ('列' + (i+1)));
  const at = {};
  cols.forEach((c,i) => { at[c.id] = i; });

  let titleIdx = cols.findIndex(c => c.is_primary_column);
  if(titleIdx < 0) titleIdx = cols.findIndex(c => c.type === 'text');
  if(titleIdx < 0) titleIdx = 0;
  const dueIdx = cols.findIndex(c => c.type === 'todo_due_date');

  const readRec = rec => {
    const cells = new Array(cols.length).fill('');
    let done = false;
    for(const f of (rec.fields || [])){
      const i = at[f.column_id];
      if(i === undefined) continue;
      const kind = cols[i].type;
      if(kind === 'text'){
        const text = String(f.text || '').trim();
        let url = '';
        for(const blk of (f.rich_text || []))
          for(const sec of (blk.elements || []))
            for(const el of (sec.elements || []))
              if(el && el.type === 'link' && el.url && !url) url = el.url;
        /* Slack は長いリンクの表示用テキストを省略形にするので、URL があればそちらを採る */
        cells[i] = url || text;
      }else if(kind === 'select'){
        const vals = (f.select || []).map(v => label[v] || '').filter(Boolean);
        cells[i] = vals[0] || '';
      }else if(kind === 'todo_completed'){
        done = !!f.checkbox;
        cells[i] = done ? '完了' : '';
      }else if(kind === 'todo_due_date'){
        cells[i] = (f.date || [])[0] || '';
      }else if(kind === 'todo_assignee'){
        cells[i] = (f.user || []).join(', ');
      }else{
        cells[i] = f.value == null ? '' : String(f.value);
      }
    }
    return {cells, done};
  };

  const rows = (obj.records || [])
    .slice()
    .sort((a,b) => (parseFloat((a.record||{}).position) || 0) - (parseFloat((b.record||{}).position) || 0))
    .map(node => {
      const row = readRec(node.record || {});
      row.subtasks = (node.children || [])
        .map(ch => {
          const c = readRec(ch.record || {});
          return {
            title: c.cells[titleIdx] || '',
            done: c.done,
            due: dueIdx >= 0 ? (c.cells[dueIdx] || '') : ''
          };
        })
        .filter(sub => sub.title.trim())
        /* Slack は子レコードを工程順とは逆に返してくることが多いので揃える */
        .reverse();
      return row;
    });

  return {header, rows, titleIdx, dueIdx, cols, colorByLabel};
}

/* Slack リスト向けの初期割り当て。列の型から当てるので名前に依存しない。 */
function guessSlackMap(parsed){
  const {cols, titleIdx, dueIdx} = parsed;
  const selects = cols.map((c,i) => ({c, i})).filter(x => x.c.type === 'select');
  const looksStatus = x => {
    const n = String(x.c.name || '');
    if(/ステータス|状態|進捗|status/i.test(n)) return true;
    const ch = (x.c.options && x.c.options.choices) || [];
    return ch.some(o => /完了|進行|着手|done|progress/i.test(o.label || ''));
  };
  const statusCol = selects.find(looksStatus);
  const projCol = selects.find(x => !statusCol || x.i !== statusCol.i);
  /* アウトプットのような、主列以外のテキスト列を参照リンクに当てる */
  const textCol = cols.map((c,i) => ({c, i}))
    .find(x => x.c.type === 'text' && x.i !== titleIdx);
  return {
    title: titleIdx,
    project: projCol ? projCol.i : -1,
    section: -1,                       /* 既定でステータス名のセクションに入れる */
    status: statusCol ? statusCol.i : -1,
    priority: -1,
    due: dueIdx,
    url: textCol ? textCol.i : -1,
    notes: -1
  };
}

/* ---------- セクションの確保 ---------- */
function ensureSection(p, name){
  if(statusByLabel(name)) return ensureStatusSection(p, name);
  let sec = p.sections.find(x => x.name === name);
  if(!sec){ sec = {id: uid('s_'), name}; p.sections.push(sec); }
  return sec;
}

/* ---------- 取り込みの本体（CSV と Slack JSON で共通） ---------- */
function importFlow(header, rows, meta){
  meta = meta || {};
  const guess = meta.guess || (() => {
    const g = {};
    for(const [key, , hints] of FIELDS){
      let idx = header.findIndex(h => hints.some(x => String(h).toLowerCase().includes(x)));
      if(key === 'title' && idx < 0) idx = 0;
      g[key] = idx;
    }
    return g;
  })();

  const colOpts = sel => '<option value="-1">— 取り込まない —</option>' +
    header.map((h,i) => '<option value="' + i + '"' + (i === sel ? ' selected' : '') + '>' +
      esc(h || ('列' + (i+1))) + '</option>').join('');
  const projOpts = S.projects.map(p =>
    '<option value="' + esc(p.id) + '"' + (p.id === UI.project ? ' selected' : '') + '>' +
    esc(p.name) + '</option>').join('') +
    '<option value="__new">＋ 新しいプロジェクトを作る</option>';

  const nSub = rows.reduce((n,r) => n + ((r.subtasks || []).length), 0);
  const preview = rows.slice(0,5)
    .map(r => '<div>' + esc(r.cells.join('  |  ')) + '</div>').join('');

  modal(meta.title || '取り込む',
    '<p class="hint">' + rows.length + ' 件' +
      (nSub ? '（サブタスク ' + nSub + ' 件つき）' : '') + 'を読み込みました。' +
      '元の列を、この画面の項目に割り当ててください。<br>' +
      'プロジェクト列を割り当てると、値ごとにプロジェクトが作られます。' +
      'セクションを空にしておくと、ステータスと同じ名前のセクションに入ります。</p>' +
    '<div class="map">' +
      '<label>取り込み先</label><select id="impProj">' + projOpts + '</select>' +
      '<label id="impNewLabel">新規名</label>' +
      '<input id="impNew" placeholder="新しいプロジェクト名" value="' +
        esc(meta.suggestName || '取り込み') + '">' +
      FIELDS.map(([k, lab]) =>
        '<label>' + lab + (k === 'title' ? ' <b style="color:var(--red)">*</b>' : '') + '</label>' +
        '<select data-map="' + k + '">' + colOpts(guess[k]) + '</select>').join('') +
    '</div>' +
    '<div class="prev"><div><b>' + esc(header.join('  |  ')) + '</b></div>' + preview + '</div>',
    '<button class="btn" onclick="document.getElementById(' + "'modalRoot'" + ').innerHTML=' + "''" + '">やめる</button>' +
    '<button class="btn pri" id="impGo">取り込む</button>');

  /* ラベルと入力は必ず一緒に出し入れする（片方だけ消すとグリッドが1マスずれる） */
  const syncNew = () => {
    const on = $('#impProj').value === '__new';
    $('#impNew').hidden = !on;
    $('#impNewLabel').hidden = !on;
  };
  $('#impProj').onchange = syncNew; syncNew();

  $('#impGo').onclick = () => {
    const map = {};
    $$('[data-map]').forEach(sel => { map[sel.dataset.map] = +sel.value; });
    if(map.title < 0){ alert('タイトルの列を選んでください。'); return; }

    let fallbackId = $('#impProj').value;
    let createdSectionId = null;
    if(fallbackId === '__new'){
      createdSectionId = uid('s_');
      const np = {id: uid('p_'), name: ($('#impNew').value || '取り込み').trim(),
                  sections: [{id: createdSectionId, name: 'バックログ'}]};
      S.projects.push(np); fallbackId = np.id;
    }

    let added = 0, skipped = 0, firstPid = fallbackId;
    for(const row of rows){
      const cell = i => (i >= 0 && i < row.cells.length) ? String(row.cells[i] == null ? '' : row.cells[i]).trim() : '';
      const title = cell(map.title);
      if(!title || isDividerTitle(title)){ skipped++; continue; }

      const tint = meta.colorByLabel || {};
      let proj;
      const pname = cell(map.project);
      if(pname){
        proj = S.projects.find(p => p.name === pname);
        if(!proj){
          proj = {id: uid('p_'), name: pname, color: colorOf(tint[pname]), sections: []};
          S.projects.push(proj);
        }else if(!proj.color && tint[pname]) proj.color = colorOf(tint[pname]);
      }else{
        proj = projById(fallbackId);
      }

      let status = map.status >= 0 ? guessStatus(cell(map.status)) : 'todo';
      if(row.done === true) status = 'done';

      const sname = cell(map.section);
      const sec = sname ? ensureSection(proj, sname)
                        : ensureStatusSection(proj, statusLabel(status));
      if(!sec.color && tint[sec.name]) sec.color = colorOf(tint[sec.name]);

      /* URL 欄に URL でない文字列（Slack のファイル ID など）が来たらメモへ回す */
      const raw = cell(map.url);
      const isUrl = raw.startsWith('http://') || raw.startsWith('https://');
      const noteParts = [];
      if(map.notes >= 0 && cell(map.notes)) noteParts.push(cell(map.notes));
      if(raw && !isUrl) noteParts.push((header[map.url] || '参照') + ': ' + raw);

      S.tasks.push({
        id: uid('t_'), projectId: proj.id, sectionId: sec.id, title,
        notes: noteParts.join(LF),
        status,
        priority: map.priority >= 0 ? guessPriority(cell(map.priority)) : '',
        due: map.due >= 0 ? guessDate(cell(map.due)) : '',
        url: isUrl ? raw : '',
        subtasks: (row.subtasks || []).map(sub => ({
          id: uid('k_'), title: sub.title.trim(),
          done: !!sub.done, due: guessDate(sub.due || '')
        })),
        createdAt: new Date().toISOString(),
        completedAt: status === 'done' ? new Date().toISOString() : null,
        order: nextOrder(proj.id, sec.id)
      });
      if(added === 0) firstPid = proj.id;
      added++;
    }

    /* 新規プロジェクトのときだけ、使われなかった既定セクションを消す。
       既存プロジェクトの空セクションは意図して置いてあるので触らない。 */
    if(createdSectionId){
      const fb = projById(fallbackId);
      if(fb && fb.sections.length > 1 && !S.tasks.some(t => t.sectionId === createdSectionId))
        fb.sections = fb.sections.filter(sec => sec.id !== createdSectionId);
    }
    /* プロジェクト列で作ったプロジェクトが空のままになることはないが、念のため */
    for(const p of S.projects) if(!p.sections.length) p.sections.push({id: uid('s_'), name: 'バックログ'});

    save(); closeModal();
    UI.project = firstPid; saveUI(); renderAll();
    toast(added + ' 件を取り込みました' + (skipped ? '（見出し・空行 ' + skipped + ' 件は除外）' : ''));
  };
}

function importCSVFlow(text){
  const table = parseCSV(text);
  if(table.length < 2){ alert('CSV に読み取れる行がありませんでした。'); return; }
  const header = table[0].map(h => String(h).trim());
  const rows = table.slice(1).map(r => ({cells: r}));
  importFlow(header, rows, {title: 'CSV を取り込む', suggestName: 'Slack バックログ'});
}

function importSlackListFlow(obj, fileName){
  const parsed = parseSlackList(obj);
  if(!parsed.rows.length){ alert('レコードが見つかりませんでした。'); return; }
  const m = obj.meta || {};
  if(m.records_truncated || m.max_subtask_depth_exceeded)
    alert('この書き出しは一部が切り詰められています。Slack 側で書き出し直すことをおすすめします。');
  importFlow(parsed.header, parsed.rows, {
    title: 'Slack リストを取り込む',
    guess: guessSlackMap(parsed),
    colorByLabel: parsed.colorByLabel,
    suggestName: ((obj.list || {}).title || fileName || '取り込み')
  });
}

function importJSON(data){
  if(!confirm('現在の内容を、読み込んだ JSON で置き換えます。よろしいですか？')) return;
  S = normalize(data);
  selected = null; UI.project = S.projects[0].id;
  save(); saveUI(); renderAll();
  toast('取り込みました');
}

function handleFile(file){
  const name = String(file.name || '').toLowerCase();
  const r = new FileReader();
  r.onload = () => {
    const text = String(r.result);
    if(name.endsWith('.csv')){ importCSVFlow(text); return; }
    if(!name.endsWith('.json')){ alert('.csv か .json を渡してください。'); return; }
    let j;
    try{ j = JSON.parse(text); }
    catch(e){ alert('JSON として読めませんでした。' + LF + e.message); return; }
    if(isSlackListFile(j)){ importSlackListFlow(j, file.name); return; }
    if(isTaskboardFile(j)){ importJSON(j); return; }
    alert('この JSON は taskboard のデータでも Slack リストの書き出しでもありません。');
  };
  r.readAsText(file, 'utf-8');
}

/* プロジェクトの並べ替えと削除。削除するときは、中のタスクを必ず別プロジェクトへ移す。 */
function projectMenu(pid){
  const p = projById(pid); if(!p) return;
  const n = S.tasks.filter(t => t.projectId === pid).length;
  const i = S.projects.indexOf(p);
  const others = S.projects.filter(x => x.id !== pid);
  const destOpts = others.map(x =>
    `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');

  modal('プロジェクト「' + p.name + '」',
    `<p class="hint">タスク ${n} 件、セクション ${p.sections.length} 個。
       名前は画面上部の見出しをクリックすると変えられます。</p>
     <div class="crow"><span>色</span>${colorPicker(p.color)}</div>
     <div style="display:flex;gap:8px;flex-wrap:wrap">
       <button class="btn" id="pUp"${i === 0 ? ' disabled' : ''}>↑ 上へ</button>
       <button class="btn" id="pDown"${i === S.projects.length - 1 ? ' disabled' : ''}>↓ 下へ</button>
     </div>` +
    (others.length
      ? `<div class="map" style="margin-top:18px">
           <label>削除するとき<br>タスクの移動先</label>
           <select id="pDest">${destOpts}</select></div>`
      : `<p class="hint" style="margin-top:18px">最後のプロジェクトなので削除できません。</p>`),
    `<button class="btn" onclick="document.getElementById('modalRoot').innerHTML=''">閉じる</button>` +
    (others.length
      ? `<button class="btn" id="pDel" style="color:var(--red);border-color:var(--red)">削除</button>`
      : ''));

  bindColorPicker($('#modalRoot'), v => { p.color = colorOf(v); });
  const move = to => {
    S.projects.splice(i, 1); S.projects.splice(to, 0, p);
    save(); closeModal(); renderSide();
  };
  $('#pUp').onclick   = () => move(i - 1);
  $('#pDown').onclick = () => move(i + 1);

  if(!others.length) return;
  $('#pDel').onclick = () => {
    const dest = projById($('#pDest').value); if(!dest) return;
    if(n && !confirm(n + ' 件のタスクを「' + dest.name + '」へ移してから削除します。よろしいですか？')) return;
    if(!n && !confirm('「' + p.name + '」を削除します。よろしいですか？')) return;
    for(const t of S.tasks){
      if(t.projectId !== pid) continue;
      t.projectId = dest.id;
      /* 移動先の「同じステータスの列」に入れる。先頭の列に押し込むと
         セクションとステータスの連動が働いて、ステータスまで書き換わってしまう。 */
      const sec = ensureStatusSection(dest, statusLabel(t.status));
      t.sectionId = sec.id;
      t.order = nextOrder(dest.id, sec.id);
    }
    S.projects = S.projects.filter(x => x.id !== pid);
    if(UI.project === pid) UI.project = dest.id;
    selected = null;
    save(); saveUI(); closeModal(); renderAll();
    toast('「' + p.name + '」を削除しました');
  };
}

  $('#secUp').onclick   = () => { p.sections.splice(i,1); p.sections.splice(i-1,0,s); save(); closeModal(); renderList(); };
  $('#secDown').onclick = () => { p.sections.splice(i,1); p.sections.splice(i+1,0,s); save(); closeModal(); renderList(); };
  $('#secAdd').onclick  = () => {
    const name = prompt('セクション名', '新しいセクション'); if(!name) return;
    p.sections.splice(i+1, 0, {id: uid('s_'), name: name.trim()});
    save(); closeModal(); renderList();
  };
  $('#secDel').onclick = () => {
    if(p.sections.length === 1){ alert('最後のセクションは削除できません。'); return; }
    if(n && !confirm(n + ' 件のタスクを、上のセクションに移してから削除します。よろしいですか？')) return;
    const dest = p.sections[i === 0 ? 1 : i-1];
    S.tasks.forEach(t => { if(t.sectionId === sid) t.sectionId = dest.id; });
    p.sections.splice(i, 1);
    save(); closeModal(); renderList();
  };
}

/* --- ドラッグ＆ドロップ並べ替え（リストの行とボードのカード、どちらも） --- */
let dragId = null;
const dragItem = e => e.target.closest('.row, .card');
const clearDropMarks = () => {
  $$('.row, .card').forEach(r => r.classList.remove('drop-before','drop-after'));
  $$('.sec-head, .col').forEach(h => h.classList.remove('drop'));
};

/* draggable は押した瞬間だけ立てる。常に true にしておくと、
   中のタイトル入力欄にカーソルを置けなくなる（ドラッグが始まってしまう）。
   行は掴み手から、カードは入力欄以外のどこからでも掴める。 */
let armed = null;
const disarm = () => { if(armed){ armed.draggable = false; armed = null; } };
list.addEventListener('mousedown', e => {
  disarm();
  if(e.target.closest('input, textarea, select, button, a')) return;
  const grip = e.target.closest('.grip');
  const target = grip ? grip.closest('.row') : e.target.closest('.card');
  if(target){ target.draggable = true; armed = target; }
});
list.addEventListener('mouseup', disarm);
list.addEventListener('dragstart', e => {
  const item = dragItem(e); if(!item) return;
  dragId = item.dataset.t;
  item.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', dragId); }catch(err){}
});
list.addEventListener('dragend', () => {
  dragId = null;
  armed = null;
  $$('.row, .card').forEach(r => {
    r.draggable = false;
    r.classList.remove('dragging');
  });
  clearDropMarks();
});
list.addEventListener('dragover', e => {
  if(!dragId) return;
  e.preventDefault();
  clearDropMarks();
  const item = dragItem(e);
  if(item && item.dataset.t !== dragId){
    const r = item.getBoundingClientRect();
    item.classList.add(e.clientY < r.top + r.height/2 ? 'drop-before' : 'drop-after');
    return;
  }
  const col = e.target.closest('.col');
  if(col && col.dataset.s){ col.classList.add('drop'); return; }
  const head = e.target.closest('.sec-head');
  if(head && head.dataset.s) head.classList.add('drop');
});
list.addEventListener('drop', e => {
  if(!dragId) return;
  e.preventDefault();
  const moving = taskById(dragId); if(!moving) return;

  const item = dragItem(e);
  /* つかんだものを同じ場所に落としただけなら何もしない。
     ボードでは自分のカードも列の内側なので、これが無いと列末尾へ飛ばされる。 */
  if(item && item.dataset.t === dragId) return;

  if(item && item.dataset.t !== dragId){
    const target = taskById(item.dataset.t);
    if(!target) return;
    const r = item.getBoundingClientRect();
    const before = e.clientY < r.top + r.height/2;
    let sibs;
    if(UI.project === '*'){
      /* 横断ビューではプロジェクトを移さない。区切りの名前だけ合わせる。
         プロジェクトの付け替えは詳細パネルからやる。 */
      const nm = secName(target.projectId, target.sectionId);
      moving.sectionId = ensureSection(projById(moving.projectId), nm).id;
      sibs = S.tasks
        .filter(t => t.id !== moving.id && secName(t.projectId, t.sectionId) === nm)
        .sort((a,b) => a.order - b.order);
    }else{
      moving.projectId = target.projectId;
      moving.sectionId = target.sectionId;
      sibs = S.tasks
        .filter(t => t.sectionId === target.sectionId && t.projectId === target.projectId && t.id !== moving.id)
        .sort((a,b) => a.order - b.order);
    }
    const idx = sibs.indexOf(target);
    const prev = before ? (idx > 0 ? sibs[idx-1].order : target.order - 2000) : target.order;
    const next = before ? target.order : (idx < sibs.length-1 ? sibs[idx+1].order : target.order + 2000);
    moving.order = (prev + next) / 2;
    syncStatusToSection(moving);
  }else{
    /* 列の余白へのドロップ。ボードは末尾、リストの見出しは先頭に入れる。
       横断ビューの区切りは data-sname で識別する。data-s には折りたたみ用の
       キー（name:...）が入っていて実在するセクション id ではないので、先に見る。 */
    const col = e.target.closest('.col');
    const head = e.target.closest('.sec-head');
    const toEnd = !!col;
    const sname = (col && col.dataset.sname) || (head && head.dataset.sname);
    const sid = sname ? null : ((col && col.dataset.s) || (head && head.dataset.s));

    if(sname){
      const inGroup = S.tasks.filter(t => t.id !== moving.id &&
                                     secName(t.projectId, t.sectionId) === sname);
      moving.sectionId = ensureSection(projById(moving.projectId), sname).id;
      moving.order = inGroup.length
        ? (toEnd ? Math.max(...inGroup.map(t => t.order)) + 1000
                 : Math.min(...inGroup.map(t => t.order)) - 1000)
        : 1000;
    }else if(sid){
      if(UI.project !== '*') moving.projectId = UI.project;
      moving.sectionId = sid;
      if(toEnd){
        moving.order = nextOrder(moving.projectId, sid);
      }else{
        const sibs = S.tasks.filter(t => t.sectionId === sid && t.id !== moving.id);
        moving.order = sibs.length ? Math.min(...sibs.map(t => t.order)) - 1000 : 1000;
      }
    }else return;
    syncStatusToSection(moving);
  }
  save(); renderAll();
});

/* =========================================================================
   週ビュー — 左にタスクバー、右に週カレンダー（Sunsama 型）。日曜始まり
   カレンダーに置く単位は「最小のタスク」。サブタスクがあるタスクはサブタスクを置き、
   親は置かない。時刻は置いたもの（タスク or サブタスク）の schedule {date, start, setAt} に持つ。
   長さは工数から出す。
   Google カレンダーへの反映は Claude の同期ルーティン（taskboard-sync）の仕事で、
   結果は calendar.json に置かれる。この画面は calendar.json を読むだけで書かない。
   書き手を1人ずつに分けて、tasks.json と calendar.json が上書きし合わないようにするため。
   ========================================================================= */
/* 1時間 88px（15分 = 22px）。15分の会議でも文字が読めて、隣と重なって見えないように */
let WK_START_H = 8, WK_END_H = 21;   /* 設定の「カレンダーの表示時間帯」で上書きされる */
const WK_PX_H = 88, WK_SNAP = 15;
const DOW = ['日','月','火','水','木','金','土'];
/* 「この週にやる」に出すステータス。タスク化（＝着手待ち）より後ろ */
const WK_ACTIVE = new Set(['ticketed', 'doing', 'release']);
let CAL = null;           // calendar.json の中身。無ければ null
let wkOffset = 0;         // 0 = 今週。持ち越さない
let wkDrag = null;        // {id, grab} grab = 掴んだ位置がブロック上端から何分か
let wkBacklogOpen = false;

const pad2 = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const toMin = hm => { const [h, m] = String(hm).split(':').map(Number); return h * 60 + m; };
const toHM = m => pad2(Math.floor(m / 60)) + ':' + pad2(m % 60);
const mdOf = iso => Number(iso.slice(5, 7)) + '/' + Number(iso.slice(8, 10));

function normSchedule(v){
  if(!v || typeof v !== 'object') return null;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v.date || '') || !/^\d{2}:\d{2}$/.test(v.start || '')) return null;
  return {date: v.date, start: v.start, setAt: v.setAt || new Date().toISOString()};
}
function weekDays(){
  const d = new Date(); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - d.getDay() + wkOffset * 7);
  return Array.from({length: 7}, (_, i) => { const x = new Date(d); x.setDate(d.getDate() + i); return x; });
}

/* --- 置く単位（ユニット）: {id, t, s}。s があればサブタスク --- */
function allUnits(){
  const out = [];
  for(const t of S.tasks){
    out.push({id: t.id, t, s: null});
    for(const k of t.subtasks) out.push({id: k.id, t, s: k});
  }
  return out;
}
function unitById(id){
  for(const t of S.tasks){
    if(t.id === id) return {id, t, s: null};
    const k = t.subtasks.find(x => x.id === id);
    if(k) return {id, t, s: k};
  }
  return null;
}
const uObj = u => u.s || u.t;                         // schedule を持つ方
const uDone = u => isDone(u.t) || (u.s ? u.s.done : false);
const uTitle = u => (u.s ? u.s.title : u.t.title) || '（無題）';
/* 工数が未設定なら 1h として置く。0h のブロックは掴めないため */
/* 工数が空のときに置く長さ（時間）。置いた時点でこの値がタスクの工数にも入る */
const WK_DEFAULT_H = 0.5;
const uMins = u => Math.round(((u.s ? u.s.estimate : taskHours(u.t).hours) || WK_DEFAULT_H) * 60);
const uEnd = u => toHM(Math.min(toMin(uObj(u).schedule.start) + uMins(u), 24 * 60 - 1));
const linkOf = id => (CAL && CAL.links && CAL.links[id]) || null;

/* カレンダーに反映済みか。'' は時刻も予定も無いもの */
function syncState(u){
  const L = linkOf(u.id), s = uObj(u).schedule;
  if(!s) return (L && !L.gone) ? 'pending' : '';
  if(!L || L.gone) return 'pending';
  return (L.date === s.date && L.start === s.start && L.end === uEnd(u)) ? 'synced' : 'pending';
}
/* Google カレンダーの予定の色（colorId → 色）。色を付けていない予定はグレーのまま */
const GCAL_COLORS = {'1': '#7986cb', '2': '#33b679', '3': '#8e24aa', '4': '#e67c73', '5': '#f6bf26', '6': '#f4511e',
                     '7': '#039be5', '8': '#616161', '9': '#3f51b5', '10': '#0b8043', '11': '#d50000'};
const meetStyle = e => { const c = GCAL_COLORS[e.colorId]; return c
  ? 'background:color-mix(in srgb, ' + c + ' 30%, var(--panel));border-color:color-mix(in srgb, ' + c + ' 60%, var(--panel));' +
    'border-left:3px solid ' + c + ';color:var(--ink);' : ''; };
function evTimes(e){
  const mv = e.id && S.eventMoves && S.eventMoves[e.id];
  if(mv) return {date: mv.date, s: toMin(mv.start), e: toMin(mv.end), moved: true};
  const s = new Date(e.start), en = new Date(e.end);
  return {date: isoOf(s), s: s.getHours() * 60 + s.getMinutes(),
          e: isoOf(en) === isoOf(s) ? en.getHours() * 60 + en.getMinutes() : 24 * 60, moved: false};
}
/* 同期で反映された（カレンダーの時刻が動かした先と同じになった）ものは消す。
   同期の方が新しいのに時刻が違うものも消す（カレンダー側でさらに動かされた） */
function adoptEventMoves(){
  if(!CAL || !Array.isArray(CAL.events) || !S.eventMoves) return false;
  let changed = false;
  for(const [id, mv] of Object.entries(S.eventMoves)){
    const e = CAL.events.find(x => x.id === id);
    if(!e) continue;
    const s = new Date(e.start);
    const same = isoOf(s) === mv.date && toHM(s.getHours() * 60 + s.getMinutes()) === mv.start;
    if(same || Date.parse(CAL.syncedAt) > Date.parse(mv.setAt)){ delete S.eventMoves[id]; changed = true; }
  }
  return changed;
}
function pendingCount(){
  const us = allUnits();
  const ids = new Set(us.map(u => u.id));
  let n = us.filter(u => syncState(u) === 'pending').length;
  /* 消したタスクの予定もカレンダーから外す必要がある */
  if(CAL && CAL.links) n += Object.keys(CAL.links).filter(id => !ids.has(id) && !CAL.links[id].gone).length;
  n += Object.keys(S.eventMoves || {}).length;   /* 動かした自分の予定 */
  return n;
}

/* カレンダー側で動かした・消した予定を取り込む。
   同期の方が新しい（syncedAt > setAt）ときだけ。画面で動かして未反映の分は上書きしない。 */
function adoptCalendar(){
  if(!CAL || !CAL.links) return false;
  let changed = false;
  for(const u of allUnits()){
    const L = CAL.links[u.id], o = uObj(u), s = o.schedule;
    if(!L || !s || !(Date.parse(L.syncedAt) > Date.parse(s.setAt))) continue;
    if(L.gone){ o.schedule = null; changed = true; continue; }
    if(L.date !== s.date || L.start !== s.start){
      o.schedule = {date: L.date, start: L.start, setAt: L.syncedAt}; changed = true;
    }
  }
  return changed;
}
async function loadCalendar(){
  try{
    const r = await fetch('calendar.json?ts=' + Date.now(), {cache: 'no-store'});
    if(!r.ok) return;
    CAL = await r.json();
  }catch(e){ return; }
  const a1 = adoptCalendar(), a2 = adoptEventMoves();
  if(a1 || a2) save();
  if(UI.view === 'week') renderWeek();
}

/* --- 「Claude に同期を頼む」ボタン ---
   server.py が裏で Claude Code（コマンド版）に taskboard-sync を頼む。終わるまで数十秒〜数分。
   その間は数秒おきに様子を見て、終わったら calendar.json と inbox.json を読み直す。 */
let syncInfo = null;        // server.py の /api/sync の返事
let syncTimer = null;
const syncRunning = () => !!(syncInfo && syncInfo.state === 'running');
async function startSync(){
  try{
    /* 週カレンダーで今週・来週以外を見ていたら、その週も取り込んでもらう */
    let body = null;
    if(UI.view === 'week' && (wkOffset < 0 || wkOffset > 1)){
      const d = weekDays().map(isoOf);
      body = JSON.stringify({from: d[0], to: d[6]});
    }
    const r = await fetch('/api/sync', body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body}
                                            : {method: 'POST'});
    syncInfo = await r.json();
  }catch(e){
    toast('同期を始められませんでした。サーバーが動いているか確認してください');
    return;
  }
  if(syncInfo.ok === false && syncInfo.state !== 'running'){ toast(syncInfo.error || '同期を始められませんでした'); return; }
  $('#syncPop').hidden = true;
  renderTop();
  if(UI.view === 'week') renderWeek();
  pollSync();
}
function pollSync(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try{ syncInfo = await (await fetch('/api/sync?ts=' + Date.now(), {cache: 'no-store'})).json(); }catch(e){}
    if(syncRunning()){ pollSync(); return; }
    await loadCalendar(); await loadInbox();
    renderTop();
    if(UI.view === 'week') renderWeek();
    showSyncPop();
  }, 4000);
}
/* 開いたときに裏で同期中なら、終わるのを待つ */
(async () => {
  try{ syncInfo = await (await fetch('/api/sync?ts=' + Date.now(), {cache: 'no-store'})).json(); }catch(e){ return; }
  if(syncRunning()){ renderTop(); pollSync(); }
})();
$('#btnSync').addEventListener('click', () => { if(!syncRunning()) startSync(); });
/* 同期の結果は「成功か、失敗ならその理由」だけ出す。
   成功＝プロセスが正常終了し、報告の「エラー：」行が「なし」。それ以外は失敗として理由を出す */
function syncOutcome(){
  if(!syncInfo || (!syncInfo.summary && syncInfo.state !== 'error')) return null;
  const text = syncInfo.summary || '';
  const lines = text.split('\n').map(x => x.trim()).filter(Boolean);
  const line = lines.find(x => /^エラー[：:]/.test(x));
  const reason = line ? line.replace(/^エラー[：:]\s*/, '') : '';
  if(syncInfo.state === 'done' && (reason === 'なし' || (!line && lines.length))) return {ok: true};
  return {ok: false, reason: reason && reason !== 'なし' ? reason : (lines[lines.length - 1] || '原因不明')};
}
let syncPopTimer = null;
function showSyncPop(){
  const pop = $('#syncPop'), o = syncOutcome();
  clearTimeout(syncPopTimer);
  if(!o){ pop.hidden = true; return; }
  pop.className = 'sync-pop ' + (o.ok ? 'ok' : 'err');
  pop.innerHTML = '<span class="sync-pop-i">' + (o.ok ? '✓' : '!') + '</span>' +
    '<span>' + (o.ok ? '正常に完了しました' : 'エラー：' + esc(o.reason)) + '</span>' +
    '<button title="閉じる">✕</button>';
  pop.hidden = false;
  pop.querySelector('button').onclick = () => { pop.hidden = true; };
  if(o.ok) syncPopTimer = setTimeout(() => { pop.hidden = true; }, 6000);
}

function fillDefaultEstimate(u){

/* 重なった予定を横に並べる */
function layoutDay(items){
  items.sort((a, b) => a.s - b.s || b.e - a.e);
  let cluster = [], end = -1;
  const flush = () => {
    const lanes = [];
    for(const it of cluster){
      let i = lanes.findIndex(x => x <= it.s);
      if(i < 0){ i = lanes.length; lanes.push(0); }
      lanes[i] = it.e; it.lane = i;
    }
    cluster.forEach(it => it.lanes = lanes.length);
    cluster = [];
  };
  for(const it of items){
    if(cluster.length && it.s >= end){ flush(); end = -1; }
    cluster.push(it); end = Math.max(end, it.e);
  }
  if(cluster.length) flush();
  return items;
}

function inboxToSchedule(x, date, start){
  let p = projById(x.pid) || S.projects.find(y => y.name === INBOX_FALLBACK);
  if(!p){
    p = {id: uid('p_'), name: INBOX_FALLBACK, color: '', sections: [{id: uid('s_'), name: STATUS[0][1]}]};
    S.projects.push(p);
  }
  const schedule = {date, start, setAt: new Date().toISOString()};
  const parent = x.parent ? taskById(x.parent) : null;
  inboxTake(x.id);
  if(parent){
    parent.subtasks.push({id: uid('k_'), title: x.title, done: false, due: x.due || date,
                          estimate: normEstimate(x.estimate) || WK_DEFAULT_H, schedule});
  }else{
    const sec = ensureStatusSection(p, STATUS[1][1]);
    const t = addTask(p.id, sec.id, x.title);

/* 左のバーの項目の高さ。カレンダーのブロックと同じ縮尺（1時間 = WK_PX_H） */
const barPx = mins => Math.max(Math.round(mins / 60 * WK_PX_H) - 2, 40);

/* 左のタスクバーに出す単位。サブタスクがあるタスクは、未完了のサブタスクだけ（完了は出さない） */
function barUnits(){
  const q = (UI.q || '').toLowerCase();
  const out = [];
  for(const t of S.tasks){
    if(isDone(t) || (UI.project !== '*' && t.projectId !== UI.project)) continue;
    const hit = !q || (t.title + ' ' + t.notes + ' ' + t.subtasks.map(k => k.title).join(' ')).toLowerCase().includes(q);
    if(!hit) continue;
    if(t.subtasks.length){
      for(const k of t.subtasks) if(!k.done && !k.schedule) out.push({id: k.id, t, s: k});
    }else if(!t.schedule){
      out.push({id: t.id, t, s: null});
    }
  }
  const dueOf = u => (u.s && u.s.due) || u.t.due || '9999';
  const subIdx = u => u.s ? u.t.subtasks.indexOf(u.s) : -1;
  return out.sort((a, b) => dueOf(a).localeCompare(dueOf(b)) || a.t.order - b.t.order || subIdx(a) - subIdx(b));
}

  const placed = allUnits().filter(u => uObj(u).schedule);

  days.forEach((d, i) => {

    const off = d.getDay() === 0 || d.getDay() === 6;
    head += '<div class="' + (iso === today ? 'today' : '') + (off ? ' off' : '') + '">' +

    allday += '<div>' + evs.filter(e => {

      })
      .map(e => '<span class="wk-chip" title="' + esc(e.title) + '">' + esc(e.title) + '</span>').join('') + '</div>';

    const items = [];
    for(const e of evs){
      if(e.allDay) continue;
      const t = evTimes(e);
      if(t.date !== iso) continue;
      items.push({s: t.s, e: t.e, meet: e, moved: t.moved});
    }
    for(const u of placed){
      const sc = uObj(u).schedule;
      if(sc.date !== iso || uDone(u)) continue;
      const s = toMin(sc.start);
      items.push({s, e: s + uMins(u), unit: u});
    }
    let blocks = '';
    for(const it of layoutDay(items)){
      const s = Math.max(it.s, WK_START_H * 60), e = Math.min(Math.max(it.e, it.s + 15), WK_END_H * 60);

          ' title="' + esc(label + ' ' + time + (st === 'pending' ? '（カレンダー未反映）' : '')) + '">' +
          esc(uTitle(u)) + '<small>' + time + '</small>' +
          /* サブタスクがあるタスクは工数が合計なので、長さは変えられない */
          (u.s || !u.t.subtasks.length ? '<span class="wk-rs" data-rs="' + esc(u.id) + '" title="ドラッグで長さ（工数）を変える"></span>' : '') +

    }
    cols += '<div class="wk-day' + (iso === today ? ' today' : '') + '" data-date="' + iso + '" style="height:' + H +
      'px;background-image:' + grid + '">' + blocks + '</div>';
  });
  head += '</div>'; allday += '</div>';

  /* 同期の状態。会議は Claude が取り込んだ範囲しか見えない */
  const pend = pendingCount();
  let sync = CAL && CAL.syncedAt
    ? 'カレンダー取り込み ' + new Date(CAL.syncedAt).toLocaleString('ja-JP', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'})
    : 'カレンダー未取り込み';
  const rngs = CAL ? (CAL.ranges || (CAL.range ? [CAL.range] : [])) : [];
  if(CAL && rngs.length && !rngs.some(r => r.from <= isos[0] && isos[6] <= r.to))

  if(pend) sync += ' · <b>未反映 ' + pend + '件</b>';

  el.innerHTML =
    '<div class="wk-top">' +
      '<button data-wk="prev" title="前の週">‹</button><button data-wk="now">今週</button>' +
      '<button data-wk="next" title="次の週">›</button>' +
      '<span class="wk-range">' + mdOf(isos[0]) + ' – ' + mdOf(isos[6]) + '</span>' +
      '<span class="spacer"></span><span class="wk-sync">' + sync + '</span>' +
    '</div>' +
    '<div class="wk-wrap">' + bar +
      '<div><div class="wk-cal">' + head + allday + '<div class="wk-grid">' + hours + cols + '</div></div>' +
      '<div class="wk-legend"><span><i style="background:var(--violet-bg);border:1px solid var(--violet)"></i>タスク</span>' +
      '<span><i style="background:var(--violet-bg);border:1px dashed var(--violet)"></i>カレンダー未反映</span>' +
      '<span><i style="background:var(--sunk);border:1px solid var(--line)"></i>会議（Google カレンダー）</span></div></div>' +
    '</div>';
}

const week = $('#week');
function wkClearDrop(){
  $$('.wk-ghost', week).forEach(g => g.remove());
  $$('.drop', week).forEach(x => x.classList.remove('drop'));
}
/* その日の埋まっている時間（分）。会議と、置いてあるタスク（動かしている本人と完了済みは除く）。
   6時間以上の予定（勤務時間の枠など）は背景とみなして数えない。それも避けると1日中置けなくなるため */
const WK_LONG_EVENT = 6 * 60;
function busyOn(date, exceptId){
  const out = [];
  for(const e of (CAL && Array.isArray(CAL.events)) ? CAL.events : []){
    if(e.allDay) continue;
    const s = new Date(e.start), en = new Date(e.end);
    if(isoOf(s) !== date) continue;
    const a = s.getHours() * 60 + s.getMinutes();
    const b = isoOf(en) === date ? en.getHours() * 60 + en.getMinutes() : 24 * 60;
    if(b - a >= WK_LONG_EVENT) continue;
    out.push([a, b]);
  }
  for(const u of allUnits()){
    const sc = uObj(u).schedule;
    if(!sc || sc.date !== date || u.id === exceptId || uDone(u)) continue;
    const a = toMin(sc.start);
    out.push([a, a + uMins(u)]);
  }
  return out;
}
/* 置きたい時刻に一番近い、15分刻みで何とも重ならない時刻。同じ近さなら後ろを選ぶ。
   どこにも空きが無ければ、置きたい時刻のまま */
function freeStart(want, dur, busy){
  const lo = WK_START_H * 60, hi = WK_END_H * 60 - dur;
  const ok = s => busy.every(([a, b]) => s + dur <= a || s >= b);
  if(ok(want)) return want;
  for(let d = WK_SNAP; d <= hi - lo; d += WK_SNAP){
    if(want + d <= hi && ok(want + d)) return want + d;
    if(want - d >= lo && ok(want - d)) return want - d;
  }
  return want;
}
function wkDropStart(day, e){
  const dur = Math.min(dragMins(wkDrag.id), (WK_END_H - WK_START_H) * 60);
  const r = day.getBoundingClientRect();
  let m = WK_START_H * 60 + (e.clientY - r.top) / WK_PX_H * 60 - wkDrag.grab;
  m = Math.round(m / WK_SNAP) * WK_SNAP;
  m = Math.max(WK_START_H * 60, Math.min(m, WK_END_H * 60 - dur));
  return {start: m, dur};   /* 重なっても、置いた位置そのまま（自動でずらさない） */
}

  const u = unitById(h.dataset.rs); if(!u || !uObj(u).schedule) return;
  const blk = h.closest('.wk-blk'), day = h.closest('.wk-day');
  blk.draggable = false;                       /* 長さを変えている間は、移動のドラッグを止める */
  const start = toMin(uObj(u).schedule.start);
  /* 次の予定の手前まで、かつ表示時間帯の終わりまで伸ばせる */
  const next = busyOn(day.dataset.date, u.id).map(([a]) => a).filter(a => a > start);
  const max = WK_END_H * 60 - start;   /* 重ねてよいので、表示時間帯の終わりまで伸ばせる */
  wkResize = {u, blk, day, start, mins: uMins(u), max: Math.max(WK_SNAP, max)};
  blk.classList.add('resizing');
});
document.addEventListener('mousemove', e => {
  if(!wkResize) return;
  const {blk, day, start, max} = wkResize;
  const r = day.getBoundingClientRect();
  const endY = WK_START_H * 60 + (e.clientY - r.top) / WK_PX_H * 60;
  let mins = Math.round((endY - start) / WK_SNAP) * WK_SNAP;
  mins = Math.max(WK_SNAP, Math.min(mins, max));
  wkResize.mins = mins;
  blk.style.height = Math.max(yOf(start + mins) - yOf(start) - 2, 14) + 'px';
  const sm = blk.querySelector('small');
  if(sm) sm.textContent = toHM(start) + '–' + toHM(start + mins) + '（' + showHours(round2(mins / 60)) + '）';
});
document.addEventListener('mouseup', () => {
  if(!wkResize) return;
  const {u, mins} = wkResize;
  wkResize = null;
  if(mins !== uMins(u)) setDuration(u, mins); else renderWeek();
});
week.addEventListener('dragstart', e => {
  const ev = e.target.closest('[data-ev]');
  if(ev){
    const m = CAL.events.find(x => x.id === ev.dataset.ev); if(!m) return;
    const t = evTimes(m);
    wkDrag = {ev: m.id, dur: t.e - t.s, grab: (e.clientY - ev.getBoundingClientRect().top) / WK_PX_H * 60};
    ev.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', m.id); }catch(err){}
    return;
  }
  const it = e.target.closest('[data-wt]'); if(!it) return;
  const blk = it.classList.contains('wk-blk');
  wkDrag = {id: it.dataset.wt,
            grab: blk ? (e.clientY - it.getBoundingClientRect().top) / WK_PX_H * 60 : 0};
  it.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', wkDrag.id); }catch(err){}
});
week.addEventListener('dragend', () => {
  wkDrag = null; wkClearDrop();
  $$('.dragging', week).forEach(x => x.classList.remove('dragging'));
});
/* ドラッグしたまま画面の上端・下端に近づけると、カレンダーが自動でスクロールする
   （ドラッグ中はマウスホイールが効かないため）。端に近いほど速い */
const WK_EDGE = 70;
function wkAutoScroll(e){
  const r = week.getBoundingClientRect();
  const top = r.top + 90;                 /* 上に貼りついている週の切り替えと日付の行の下から数える */
  let v = 0;
  if(e.clientY < top + WK_EDGE) v = -Math.ceil((top + WK_EDGE - e.clientY) / 4);
  else if(e.clientY > r.bottom - WK_EDGE) v = Math.ceil((e.clientY - (r.bottom - WK_EDGE)) / 4);
  if(v) week.scrollTop += Math.max(-30, Math.min(30, v));
}
week.addEventListener('dragover', e => {
  if(!wkDrag) return;
  wkAutoScroll(e);
  const day = e.target.closest('.wk-day'), bar = e.target.closest('[data-wbar]');
  if(!day && !bar) return;
  e.preventDefault();
  wkClearDrop();
  if(bar){ bar.classList.add('drop'); return; }
  const {start, dur} = wkDropStart(day, e);
  const g = document.createElement('div');
  g.className = 'wk-ghost';
  g.style.top = yOf(start) + 'px';
  g.style.height = Math.max(yOf(start + dur) - yOf(start) - 2, 14) + 'px';
  g.textContent = toHM(start) + '–' + toHM(start + dur);
  day.appendChild(g);
});
week.addEventListener('drop', e => {
  if(!wkDrag) return;
  const u = unitById(wkDrag.id), ib = inboxItem(wkDrag.id);
  const day = e.target.closest('.wk-day'), bar = e.target.closest('[data-wbar]');
  e.preventDefault();
  if(wkDrag.ev){
    if(day){
      const {start, dur} = wkDropStart(day, e);
      S.eventMoves[wkDrag.ev] = {date: day.dataset.date, start: toHM(start), end: toHM(Math.min(start + dur, 24 * 60 - 1)),
                                 setAt: new Date().toISOString()};
      save(); renderWeek();
    }
    wkDrag = null; wkClearDrop(); return;
  }
  if(ib && day) inboxToSchedule(ib, day.dataset.date, toHM(wkDropStart(day, e).start));
  else if(u && day) setSchedule(u, day.dataset.date, toHM(wkDropStart(day, e).start));
  else if(u && bar && uObj(u).schedule) setSchedule(u, null);
  wkDrag = null; wkClearDrop();
});

/* =========================================================================
   inbox — 思いついたタスクの仮置き場
   Slack の自分宛てDMに「タスク」で始まるメッセージを送ると、Claude（taskboard-sync）が
   inbox.json に書く。この画面は inbox.json を読んで S.inbox に取り込むだけで、書かない。
   プロジェクトを選ぶと、そのプロジェクトの「未着手」に普通のタスクとして移る。
   ========================================================================= */
async function loadInbox(){
  let doc;
  try{
    const r = await fetch('inbox.json?ts=' + Date.now(), {cache: 'no-store'});
    if(!r.ok) return;
    doc = await r.json();
  }catch(e){ return; }
  const seen = new Set(S.inboxSeen);
  let n = 0;
  for(const it of (doc && Array.isArray(doc.items) ? doc.items : [])){
    if(!it || !it.id || !it.title || seen.has(it.id)) continue;
    S.inbox.push({id: it.id, title: String(it.title), receivedAt: it.receivedAt || '', src: it.src || 'slack'});
    S.inboxSeen.push(it.id); seen.add(it.id); n++;
  }
  if(!n) return;
  S.inboxSeen = S.inboxSeen.slice(-1000);
  save(); renderSide();
  if(UI.project === INBOX_P) renderList();
  toast('inbox に ' + n + ' 件入りました');
}

/* 振り分け先（プロジェクト・親タスク）と期日・工数は、移すまで inbox の項目に持っておく。
   選びかけで画面を閉じても消えないようにするため */
function renderInbox(el){
  const when = iso => {
    if(!iso) return '';
    const d = new Date(iso);
    return isNaN(d) ? '' : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  };
  const rows = S.inbox.map(x => {
    const id = esc(x.id);
    const projOpts = '<option value="">プロジェクト</option>' + S.projects.map(p =>
      '<option value="' + esc(p.id) + '"' + (x.pid === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('');
    const parents = x.pid ? S.tasks.filter(t => t.projectId === x.pid && !isDone(t))
      .sort((a, b) => a.order - b.order) : [];
    const parentOpts = '<option value="">親タスクなし</option>' + parents.map(t =>
      '<option value="' + esc(t.id) + '"' + (x.parent === t.id ? ' selected' : '') + '>' + esc(t.title || '（無題）') + '</option>').join('');
    return '<div class="ib-row" data-ib="' + id + '">' +
      '<div class="ib-line">' +
        '<input class="ib-title" data-ibt="' + id + '" value="' + esc(x.title) + '">' +
        '<span class="ib-when">' + when(x.receivedAt) + (x.src === 'slack' ? ' · Slack' : '') + '</span>' +
        '<button class="ib-del" data-ibdel="' + id + '" title="消す">✕</button>' +
      '</div>' +
      '<div class="ib-line ib-ctl">' +
        '<select class="ib-sel" data-ibf="pid" data-id="' + id + '">' + projOpts + '</select>' +
        '<select class="ib-sel ib-parent" data-ibf="parent" data-id="' + id + '"' + (x.pid ? '' : ' disabled') + '>' + parentOpts + '</select>' +
        '<label class="ib-f">期日<input type="date" data-ibf="due" data-id="' + id + '" value="' + esc(x.due || '') + '"></label>' +
        '<label class="ib-f">工数<input type="number" min="0" step="' + EST_STEP + '" data-ibf="estimate" data-id="' + id + '"' +
          ' value="' + (x.estimate != null ? x.estimate : '') + '" placeholder="h"></label>' +
        '<button class="ib-go" data-ibgo="' + id + '"' + (x.pid ? '' : ' disabled') + '>' +
          (x.parent ? 'サブタスクにする' : '移す') + '</button>' +
      '</div>' +
    '</div>';
  }).join('');
  el.innerHTML = '<div class="ib">' +
    '<div class="ib-add"><input id="ibAdd" placeholder="＋ inbox に追加（Enter）"></div>' +
    (rows || '<div class="empty"><b>inbox は空です</b>Slack の自分宛てDMで、1行目を「タスク」にして送ると、同期のときここに入ります。</div>') +
    '<div class="ib-hint">プロジェクトを選んで「移す」と、そのプロジェクトの「未着手」に入ります。' +
      '親タスクも選ぶと、そのタスクのサブタスクになります。期日と工数は空のままでも移せます。' +
      'DMは「タスク」の次の行から1行1件です。</div>' +
    '</div>';
}

function inboxTake(id){
  const i = S.inbox.findIndex(x => x.id === id);
  return i < 0 ? null : S.inbox.splice(i, 1)[0];
}
function inboxMove(id){
  const x = S.inbox.find(y => y.id === id); if(!x) return;
  const p = projById(x.pid); if(!p) return;
  const parent = x.parent ? taskById(x.parent) : null;
  inboxTake(id);
  if(parent){
    parent.subtasks.push({id: uid('k_'), title: x.title, done: false, due: x.due || '',
                          estimate: normEstimate(x.estimate), schedule: null});
    save();
    toast('「' + x.title + '」を「' + parent.title + '」のサブタスクに');
  }else{
    const sec = ensureStatusSection(p, STATUS[0][1]);
    const t = addTask(p.id, sec.id, x.title);
    if(t){ t.due = x.due || ''; t.estimate = normEstimate(x.estimate); save(); }
    toast('「' + x.title + '」を ' + p.name + ' へ');
  }
  renderSide(); renderList();
}
list.addEventListener('change', e => {
  const f = e.target.dataset && e.target.dataset.ibf; if(!f) return;
  const x = S.inbox.find(y => y.id === e.target.dataset.id); if(!x) return;
  const v = e.target.value;
  if(f === 'pid'){ x.pid = v; x.parent = ''; }
  else if(f === 'parent') x.parent = v;
  else if(f === 'due') x.due = v;
  else if(f === 'estimate'){ x.estimate = normEstimate(v); e.target.value = x.estimate != null ? x.estimate : ''; }
  save();
  if(f === 'pid' || f === 'parent') renderList();     /* 親タスクの候補とボタンの文言が変わる */
});
list.addEventListener('click', e => {
  const go = e.target.dataset && e.target.dataset.ibgo;
  if(go){ inboxMove(go); return; }
  const id = e.target.dataset && e.target.dataset.ibdel; if(!id) return;
  const at = S.inbox.findIndex(x => x.id === id);
  const x = inboxTake(id); if(!x) return;
  save(); renderSide(); renderList();
  toast('「' + x.title + '」を消しました', '元に戻す', () => {
    S.inbox.splice(Math.min(at, S.inbox.length), 0, x); save(); renderSide(); renderList();
  });
});
list.addEventListener('keydown', e => {
  if(e.key !== 'Enter' || e.isComposing) return;
  if(e.target.id === 'ibAdd'){
    const v = e.target.value.trim(); if(!v) return;
    S.inbox.push({id: uid('i_'), title: v, receivedAt: new Date().toISOString(), src: 'manual'});
    save(); renderSide(); renderList();
    const a = $('#ibAdd'); if(a) a.focus();
  }else if(e.target.dataset && e.target.dataset.ibt){ e.target.blur(); }
});
list.addEventListener('focusout', e => {
  const id = e.target.dataset && e.target.dataset.ibt; if(!id) return;
  const x = S.inbox.find(y => y.id === id); const v = e.target.value.trim();
  if(x && v && v !== x.title){ x.title = v; save(); }
});

/* =========================================================================
   設定 — 名前・アイコン・テーマ・カレンダーの時間帯
   tasks.json の settings に持つ。どのブラウザで開いても同じ見た目になるように
   ========================================================================= */
const ICON_BGS = [
  ['#6db52d', 'ハタラグリーン'], ['#f29419', 'ハタラオレンジ'], ['#2A6F97', '青'],
  ['#5B4A8A', '紫'], ['#5F5E5A', 'グレー'], ['', 'なし']
];
/* ボタンの色の候補。どれも白い文字が読める濃さにしてある */
const BTN_COLORS = [
  ['#6db52d', 'ハタラグリーン'], ['#f29419', 'ハタラオレンジ'], ['#2A6F97', '青'], ['#16897A', 'ティール'],
  ['#5B4A8A', '紫'], ['#C0503C', '赤'], ['#5F5E5A', 'グレー']
];
const ICON_EMOJIS = ['📋', '✅', '🗂️', '🌱', '🔥', '⚡', '🎯', '🚀', '☕', '🐣'];
function normSettings(v){
  v = v && typeof v === 'object' ? v : {};
  const ic = v.icon && typeof v.icon === 'object' ? v.icon : {};
  const h = (x, d) => Number.isInteger(x) && x >= 0 && x <= 24 ? x : d;
  let cs = h(v.calStart, 8), ce = h(v.calEnd, 21);
  if(ce - cs < 4){ cs = 8; ce = 21; }
  return {
    name: String(v.name || 'task backlog').slice(0, 20),
    icon: {
      type: ic.type === 'image' && ic.image ? 'image' : 'emoji',
      emoji: String(ic.emoji || '📋'),
      image: typeof ic.image === 'string' && ic.image.startsWith('data:image/') ? ic.image : '',
      bg: typeof ic.bg === 'string' ? ic.bg : '#6db52d'
    },
    theme: ['auto', 'light', 'dark'].includes(v.theme) ? v.theme : (UI && UI.theme) || 'auto',
    mainColor: BTN_COLORS.some(c => c[0] === v.mainColor) ? v.mainColor : '#6db52d',
    subColor: BTN_COLORS.some(c => c[0] === v.subColor) ? v.subColor : '#f29419',
    calStart: cs, calEnd: ce
  };
}
function iconHTML(ic, size){
  const st = 'width:' + size + 'px;height:' + size + 'px;background:' + (ic.bg || 'transparent') +
    ';font-size:' + Math.round(size * .62) + 'px';
  return ic.type === 'image'
    ? '<span class="ico" style="' + st + '"><img src="' + ic.image + '" alt=""></span>'
    : '<span class="ico" style="' + st + '">' + esc(ic.emoji) + '</span>';
}
/* ファビコンは canvas に描いて data URL にする（背景の角丸＋絵文字か画像） */
function drawFavicon(ic){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  if(ic.bg){
    g.fillStyle = ic.bg; g.beginPath();
    if(g.roundRect) g.roundRect(0, 0, 64, 64, 14); else g.rect(0, 0, 64, 64);
    g.fill();
  }
  const done = () => { try{ $('#favicon').href = c.toDataURL('image/png'); }catch(e){} };
  if(ic.type === 'image'){
    const im = new Image();
    im.onload = () => { g.save(); g.beginPath(); if(g.roundRect) g.roundRect(0, 0, 64, 64, 14); else g.rect(0, 0, 64, 64);
      g.clip(); g.drawImage(im, 0, 0, 64, 64); g.restore(); done(); };
    im.src = ic.image;
  }else{
    g.font = (ic.bg ? 40 : 52) + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(ic.emoji, 32, 36);
    done();
  }
}
function applySettings(){
  const st = S.settings = normSettings(S.settings);
  $('#brandName').textContent = st.name;
  $('#brandIcon').innerHTML = iconHTML(st.icon, 20);
  document.title = st.name;
  drawFavicon(st.icon);
  if(st.theme === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = st.theme;
  WK_START_H = st.calStart; WK_END_H = st.calEnd;
  document.documentElement.style.setProperty('--main', st.mainColor);
  document.documentElement.style.setProperty('--sub', st.subColor);
}
/* 画像は 128px 四方に切り抜いて縮めてから持つ（tasks.json を太らせないため） */
function shrinkImage(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const n = Math.min(im.width, im.height), c = document.createElement('canvas');
        c.width = c.height = 128;
        c.getContext('2d').drawImage(im, (im.width - n) / 2, (im.height - n) / 2, n, n, 0, 0, 128, 128);
        res(c.toDataURL('image/png'));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

          '<div class="set-note">週カレンダーを開いているときの「Backlog」</div></div>' +
      '</div>') +
    sec('cal', 'カレンダー', '週カレンダーの縦軸に出す時間（4時間以上）',
      '<div class="set-row">' +
        '<select class="set-in" id="setCalStart">' + hourOpts(draft.calStart, 0, 20) + '</select>' +
        '<span class="set-tilde">〜</span>' +
        '<select class="set-in" id="setCalEnd">' + hourOpts(draft.calEnd, 4, 24) + '</select>' +
      '</div>') +
    '<p class="set-err" id="setErr" hidden></p></div>',
    `<button class="btn" id="setCancel">キャンセル</button><button class="btn pri" id="setSave">保存</button>`);

  const preview = () => {
    $('#setPreview').innerHTML = iconHTML(draft.icon, 36) +
      '<span class="set-preview-name">' + esc($('#setName').value.trim() || 'task backlog') + '</span>';
  };
  preview();
  $('#setName').oninput = preview;
  $('#setIconType').onclick = e => {
    const b = e.target.closest('[data-t]'); if(!b) return;
    /* 画像はまだ選んでいなければ、選んだ時点で切り替える（それまでは絵文字のまま） */
    if(b.dataset.t === 'emoji') draft.icon.type = 'emoji';
    else if(draft.icon.image) draft.icon.type = 'image';
    else $('#setImage').click();
    $$('#setIconType button').forEach(x => x.classList.toggle('on', x === b));
    $('#setEmojiBox').hidden = b.dataset.t !== 'emoji';
    $('#setImageBox').hidden = b.dataset.t !== 'image';
    preview();
  };
  $('.set-emojis').onclick = e => {
    const b = e.target.closest('[data-e]'); if(!b) return;
    draft.icon.emoji = b.dataset.e; draft.icon.type = 'emoji'; $('#setEmoji').value = b.dataset.e; preview();
  };
  $('#setEmoji').oninput = e => { const v = e.target.value.trim(); if(v){ draft.icon.emoji = v; draft.icon.type = 'emoji'; preview(); } };
  $('#setImage').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try{
      draft.icon.image = await shrinkImage(f); draft.icon.type = 'image';
      $$('#setIconType button').forEach(x => x.classList.toggle('on', x.dataset.t === 'image'));
      $('#setEmojiBox').hidden = true; $('#setImageBox').hidden = false;
      preview();
    }
    catch(err){ $('#setErr').textContent = '画像を読み込めませんでした'; $('#setErr').hidden = false; }
  };
  $('#setBgs').onclick = e => {
    const b = e.target.closest('[data-bg]'); if(!b) return;
    draft.icon.bg = b.dataset.bg;
    $$('#setBgs button').forEach(x => x.classList.toggle('on', x === b));
    preview();
  };
  $$('[data-col]').forEach(box => box.onclick = e => {
    const b = e.target.closest('[data-c]'); if(!b) return;
    draft[box.dataset.col === 'main' ? 'mainColor' : 'subColor'] = b.dataset.c;
    $$('button', box).forEach(x => x.classList.toggle('on', x === b));
  });
  $('#setThemes').onclick = e => {
    const b = e.target.closest('[data-th]'); if(!b) return;
    draft.theme = b.dataset.th;
    $$('#setThemes button').forEach(x => x.classList.toggle('on', x === b));
  };
  $('#setCancel').onclick = closeModal;
  $('#setSave').onclick = () => {
    const cs = +$('#setCalStart').value, ce = +$('#setCalEnd').value;
    if(ce - cs < 4){
      $('#setErr').textContent = 'カレンダーの表示時間帯は4時間以上あけてください';
      $('#setErr').hidden = false; return;
    }
    draft.name = $('#setName').value.trim() || 'task backlog';
    draft.calStart = cs; draft.calEnd = ce;
    S.settings = normSettings(draft);
    applySettings(); save(); closeModal(); renderAll();
    toast('設定を保存しました');
  };
}
$('#btnSettings').onclick = openSettings;

/* --- 離脱前に確実に書き出す --- */
window.addEventListener('beforeunload', () => { try{ localStorage.setItem(LS_DATA, JSON.stringify(S)); }catch(err){} });

/* =========================================================================
   起動
   ========================================================================= */
(async function boot(){
  /* index.html を直接（file://）開いたときは、裏でサーバーが動いていればそちらへ移る。
     file:// のままだと保存・カレンダーの読み込み・「Claude で同期」がどれも動かないため。
     別オリジンなので中身は読めないが、no-cors の fetch が通れば「動いている」と分かる */
  if(location.protocol === 'file:'){
    const SERVER = 'http://127.0.0.1:8777/index.html';
    try{
      await Promise.race([
        fetch('http://127.0.0.1:8777/api/ping', {mode: 'no-cors', cache: 'no-store'}),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 1500))
      ]);
      location.replace(SERVER);
      return;
    }catch(e){ /* サーバーが無ければ、これまでどおりこの場で開く */ }
  }
  loadUI();
  /* 起動処理が転んでも、必ず描画まで進める。
     ここで例外を漏らすと画面が「読み込み中」のまま何も出なくなる。 */
  try{
    await Store.boot();
  }catch(err){
    Store.paint('起動に失敗しました', 'warn', 'tasks.json を選ぶ', () => Store.connect());
    console.error(err);
  }
  if(UI.project !== '*' && UI.project !== INBOX_P && !projById(UI.project)) UI.project = S.projects[0].id;
  applySettings();
  renderAll();
  loadCalendar();
  loadInbox();
})();
</script>
